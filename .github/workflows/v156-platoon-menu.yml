name: Platoons v15.6 menu cleanup
on:
  push:
    branches: [main]
    paths: ['v156-trigger.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Platoons UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('platoons-v15-real.js')
          s=p.read_text()
          s=s.replace("function platoonStandingsMarkup(p){const rows=platoonStandings(p);return `<div class=\"gr-platoon-standings\"><div class=\"gr-standings-title\">Platoon Standings</div>${rows.map((r,i)=>`<div class=\"gr-platoon-standing-row\"><span><b>${i+1}</b> ${E(r.name)}</span><strong>${Number(r.points||0)}</strong></div>`).join('')}</div>`}","function platoonStandingsMarkup(p){const rows=platoonStandings(p);return `<div class=\"gr-platoon-standings\"><div class=\"gr-standings-title\">${E(p.season||new Date().getFullYear())} Platoon Standings</div>${rows.map((r,i)=>`<div class=\"gr-platoon-standing-row\"><span><b>${i+1}</b> ${E(r.name)}</span><strong>${Number(r.points||0)}</strong></div>`).join('')}</div>`}")
          s=s.replace("<div class=\"chips\"><span class=\"chip\">${E(p.season||new Date().getFullYear())}</span><span class=\"chip\">${membersOf(p).length} cadets</span><span class=\"chip\">${E(p.visibility||'Private')}</span></div>","")
          s=s.replace("<div class=\"gr-players\">${people.map(x=>`<span class=\"gr-player ${x.guest?'guest':''}\">${E(x.name)}${x.guest?' · GUEST':''}</span>`).join('')}</div>${m.status==='ready'?", "${m.status==='ready'?")
          insert="""
function missionListMarkup(p){const ms=(p.missions||[]).filter(m=>m.type!=='war').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return ms.map(m=>`<div class=\"gr-drawer-row\" onclick=\"grViewMission('${E(m.id)}')\"><div>${dateTile(m.date)}</div><div><strong>${E(m.title||'Mission')}</strong><span>${E(m.locationName||'Course TBD')} · ${E(fmtTime(m.teeTime))}</span></div></div>`).join('')||'<div class=\"gr-after-empty\">No missions yet.</div>'}
function calendarMarkup(p){const ms=(p.missions||[]).filter(m=>m.type!=='war'&&m.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));return ms.map(m=>`<button class=\"gr-calendar-row\" onclick=\"grCloseModal();grViewMission('${E(m.id)}')\"><span>${E(fmtDate(m.date))}</span><strong>${E(m.title||m.locationName||'Mission')}</strong><em>${E(fmtTime(m.teeTime))}</em></button>`).join('')||'<div class=\"gr-after-empty\">No scheduled missions.</div>'}
window.grOpenCalendar=()=>{const p=loadPlatoonLocal();modal(`<div class=\"dialog-head\"><div><div class=\"eyebrow\">PLATOON</div><h2>Calendar</h2></div><button class=\"icon-button\" onclick=\"grCloseModal()\">✕</button></div><div class=\"gr-calendar-list\">${calendarMarkup(p)}</div>`) };
window.grOpenMissionList=()=>{const p=loadPlatoonLocal();modal(`<div class=\"dialog-head\"><div><div class=\"eyebrow\">PLATOON</div><h2>Missions</h2></div><button class=\"icon-button\" onclick=\"grCloseModal()\">✕</button></div><div class=\"gr-drawer-list\">${missionListMarkup(p)}</div>`) };
window.grOpenBlog=()=>{modal(`<div class=\"dialog-head\"><div><div class=\"eyebrow\">PLATOON</div><h2>Blog</h2></div><button class=\"icon-button\" onclick=\"grCloseModal()\">✕</button></div><div class=\"gr-blog-empty\"><strong>Platoon Blog</strong><span>Posts, chat, photos and videos are next.</span></div>`) };
function installPlatoonFab(){const nav=[...document.querySelectorAll('.nav-item')].find(x=>/Platoon/i.test(x.textContent||''));if(!nav||nav.dataset.grFab)return;nav.dataset.grFab='1';const wrap=document.createElement('div');wrap.className='gr-fab-stack';wrap.innerHTML='<button class=\"gr-fab-option\" data-go=\"calendar\">📅<span>Calendar</span></button><button class=\"gr-fab-option\" data-go=\"blog\">🗣️<span>Blog</span></button><button class=\"gr-fab-option\" data-go=\"missions\">🎯<span>Missions</span></button>';nav.parentElement.appendChild(wrap);nav.addEventListener('click',e=>{try{if(typeof state!==\"undefined\"&&state.view==='groups'){e.preventDefault();e.stopPropagation();wrap.classList.toggle('open')}}catch{}});wrap.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;wrap.classList.remove('open');if(b.dataset.go==='calendar')grOpenCalendar();if(b.dataset.go==='blog')grOpenBlog();if(b.dataset.go==='missions')grOpenMissionList()})}
"""
          s=s.replace("function modal(inner){",insert+"\nfunction modal(inner){")
          s=s.replace("setTimeout(refresh,0);","setTimeout(()=>{refresh();installPlatoonFab()},0);setInterval(installPlatoonFab,1200);")
          p.write_text(s)
          css=Path('platoons-v15-real.css')
          c=css.read_text()+"""
.gr-fab-stack{position:fixed;right:20px;bottom:84px;z-index:60;display:grid;gap:8px;pointer-events:none;opacity:0;transform:translateY(10px);transition:.18s}.gr-fab-stack.open{pointer-events:auto;opacity:1;transform:none}.gr-fab-option{display:flex;align-items:center;gap:8px;justify-content:flex-start;background:#17251f;color:#fff;border:1px solid #31453b;border-radius:999px;padding:9px 12px;box-shadow:0 8px 22px rgba(0,0,0,.3);font-weight:800}.gr-fab-option span{font-size:11px}.gr-calendar-list,.gr-drawer-list{display:grid;gap:7px;margin-top:12px}.gr-calendar-row,.gr-drawer-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:#101914;color:#fff;border:1px solid var(--line);border-radius:11px;padding:8px}.gr-calendar-row span,.gr-calendar-row em,.gr-drawer-row span{font-size:9px;color:var(--muted);font-style:normal}.gr-drawer-row{grid-template-columns:48px minmax(0,1fr);cursor:pointer}.gr-drawer-row strong,.gr-drawer-row span{display:block}.gr-blog-empty{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center}.gr-blog-empty strong,.gr-blog-empty span{display:block}.gr-blog-empty span{font-size:10px;color:var(--muted);margin-top:5px}
"""
          css.write_text(c)
          idx=Path('index.html')
          x=idx.read_text().replace('Golf Recon v15.5 Beta','Golf Recon v15.6 Beta').replace('platoons-v15-real.css?v=155','platoons-v15-real.css?v=156').replace('platoons-v15-real.js?v=155','platoons-v15-real.js?v=156')
          idx.write_text(x)
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add platoons-v15-real.js platoons-v15-real.css index.html
          git commit -m 'Refine Platoons header and add quick menu' || exit 0
          git push
