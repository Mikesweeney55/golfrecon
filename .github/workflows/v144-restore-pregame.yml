name: Restore Golf Recon v14.4 Pregame

on:
  push:
    branches: [main]
    paths:
      - scripts/restore_v144_pregame.py
      - .github/workflows/v144-restore-pregame.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore known-good Pregame structure and validate
        run: python scripts/restore_v144_pregame.py
      - name: Commit v14.4
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Golf Recon v14.4 — restore Pregame layout" || exit 0
          git push origin HEAD:main
