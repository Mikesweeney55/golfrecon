name: Build GolfRecon v13 Mapbox Course Preview

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_v130.py
      - .github/workflows/v130-mapbox-preview.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13 patch
        run: python scripts/patch_v130.py
      - name: Commit v13
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.0 Mapbox Course Preview" || exit 0
          git push origin HEAD:main
