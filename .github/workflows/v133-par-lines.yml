name: Build GolfRecon v13.3 Par Lines

on:
  push:
    branches: [v13.3-par-lines]
    paths:
      - scripts/patch_v133.py
      - .github/workflows/v133-par-lines.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13.3-par-lines
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.3 patch
        run: python scripts/patch_v133.py
      - name: Commit v13.3
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.3 par-based play lines" || exit 0
          git push origin HEAD:v13.3-par-lines
