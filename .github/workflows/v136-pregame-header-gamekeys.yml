name: Build GolfRecon v13.6 Pregame Header + Game Keys

on:
  push:
    branches: [v13.6-pregame-header-gamekeys]
    paths:
      - scripts/patch_v136.py
      - .github/workflows/v136-pregame-header-gamekeys.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13.6-pregame-header-gamekeys
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.6 patch
        run: python scripts/patch_v136.py
      - name: Commit v13.6
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.6 — Compact sticky Pregame header and Game Keys" || exit 0
          git push origin HEAD:v13.6-pregame-header-gamekeys
