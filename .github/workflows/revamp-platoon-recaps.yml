name: Revamp Platoon recaps
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-recaps-v2.py'
      - '.github/workflows/revamp-platoon-recaps.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recap polish
        run: python scripts/patch-recaps-v2.py
      - name: Verify
        run: |
          node --check dev-v15.5-results.js
          grep -q 'CLUB EAGLE' dev-v15.5-results.js
          grep -q 'Kevin Cunningham' dev-v15.5-results.js
          grep -q 'Josh Mankey' dev-v15.5-results.js
          grep -q 'gr155RecapNote' dev-v15.5-results.js
          grep -q 'dev-v15.5-results.js?v=157' index.html
      - name: Commit and push
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add dev-v15.5-results.js index.html
          git commit -m 'Polish Platoon recap voice, Club Eagle, and field notes'
          git push
