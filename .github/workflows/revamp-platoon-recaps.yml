name: Revamp Platoon recaps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revamp-platoon-recaps.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recap layout
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('dev-v15.5-results.js')
          s=p.read_text()
          replacement=r'''function lowLeaders(rows,key){
  const vals=rows.filter(r=>finite(r[key])).map(r=>Number(r[key]));if(!vals.length)return[];
  const best=Math.min(...vals);return rows.filter(r=>finite(r[key])&&Number(r[key])===best);
}
function detailHigh(detail,getter){
  const vals=detail.map(getter).filter(Number.isFinite);if(!vals.length)return[];
  const best=Math.max(...vals);if(best<=0)return[];return detail.filter(x=>getter(x)===best);
}
function detailLow(detail,getter){
  const vals=detail.map(getter).filter(Number.isFinite);if(!vals.length)return[];
  const best=Math.min(...vals);return detail.filter(x=>getter(x)===best);
}
function namesOf(p,rows,detail=false){return rows.map(x=>detail?detailDisplayName(p,x.r||x):displayName(p,(x.r||x).player_name)).join(' & ')}
function missionNarrative(p,rows,detail,birds,back,clean){
  const lines=[],net=lowLeaders(rows,'net'),gross=lowLeaders(rows,'gross');
  if(net.length){
    const score=Number(net[0].net);
    if(net.length>1)lines.push(`${namesOf(p,net)} tied low net at ${score}. Bragging rights remain under review.`);
    else {const runner=rows.filter(r=>finite(r.net)&&r!==net[0]).sort((a,b)=>Number(a.net)-Number(b.net))[0];const margin=runner?Number(runner.net)-score:null;lines.push(`${displayName(p,net[0].player_name)} took low net at ${score}${margin>0?`, ${margin} shot${margin===1?'':'s'} clear`:''}.`)}
  } else if(gross.length) lines.push(`${namesOf(p,gross)} posted low gross at ${Number(gross[0].gross)}.`);
  if(birds.length){const bits=birds.map(x=>`${detailDisplayName(p,x.r)} made birdie on ${x.s.birds.map(h=>h.hole).join(', ')}`).join('; ');lines.push(`${bits}. ${birds.length>1?'Nobody gets the birdie belt outright.':''}`)}
  if(back.length)lines.push(`${namesOf(p,back,true)} had the best back nine at ${back[0].s.back}.`);
  if(clean.length)lines.push(`${namesOf(p,clean,true)} kept the cleanest card with ${clean[0].s.doubles.length} double-or-worse hole${clean[0].s.doubles.length===1?'':'s'}.`);
  if(!detail.some(x=>x.s.holes.length))lines.push('Hole-by-hole detail is still limited, so this recap stays with the official results.');
  return lines.slice(0,4);
}
function summaryMarkup(p,m){
  const rows=standings(m);if(!rows.length)return '<div class="gr155-empty">No results yet.</div>';
  const detail=rows.map(r=>({r,s:detailStats(r)})),net=lowLeaders(rows,'net'),gross=lowLeaders(rows,'gross');
  const birds=detailHigh(detail,x=>x.s.birds.length),back=detailLow(detail.filter(x=>x.s.back!==null),x=>x.s.back),clean=detailLow(detail.filter(x=>x.s.holes.length),x=>x.s.doubles.length);
  const table=rows.map((r,i)=>`<div class="gr155-recap-row"><span><b>${finite(r.finish_position)?Number(r.finish_position):i+1}</b> ${esc(displayName(p,r.player_name))}</span><span>${finite(r.net)?`N ${Number(r.net)}`:'N —'} · ${finite(r.gross)?`G ${Number(r.gross)}`:'G —'}</span></div>`).join('');
  const hi=[];
  if(net.length)hi.push(`<div class="gr155-recap-hi"><span>Low Net</span><strong>${esc(namesOf(p,net))} · ${Number(net[0].net)}</strong></div>`);
  if(gross.length)hi.push(`<div class="gr155-recap-hi"><span>Low Gross</span><strong>${esc(namesOf(p,gross))} · ${Number(gross[0].gross)}</strong></div>`);
  if(birds.length)hi.push(`<div class="gr155-recap-hi"><span>Birdies</span><strong>${esc(namesOf(p,birds,true))} · ${birds[0].s.birds.length}</strong></div>`);
  if(back.length)hi.push(`<div class="gr155-recap-hi"><span>Best Back 9</span><strong>${esc(namesOf(p,back,true))} · ${back[0].s.back}</strong></div>`);
  const intel=missionNarrative(p,rows,detail,birds,back,clean);
  return `<div class="gr155-recap-grid"><section class="gr155-recap-block"><div class="gr155-recap-title">RESULT STANDINGS</div>${table}</section><section class="gr155-recap-block"><div class="gr155-recap-title">HIGHLIGHTED SCORES</div>${hi.join('')||'<div class="gr155-empty">No confirmed highlights yet.</div>'}</section><section class="gr155-recap-block gr155-recap-copy"><div class="gr155-recap-title">AFTER ACTION REPORT</div>${intel.map(x=>`<p>${esc(x)}</p>`).join('')}</section></div>`;
}
function platoonRecapMarkup(p){
  const complete=(p.missions||[]).filter(m=>m.type!=='war'&&m.status==='completed'),map=new Map((p.members||[]).map(m=>[m.id,{member:m,points:0,birds:0,eagles:0,wins:0}]));
  for(const m of complete)for(const r of (m.results||[])){const mm=canonicalMember(p,r.player_name);if(!mm||!map.has(mm.id))continue;const x=map.get(mm.id),st=detailStats(r);x.points+=Number(r.raw_points||0);x.birds+=st.birds.length;x.eagles+=st.eagles.length;if(Number(r.finish_position)===1)x.wins++}
  const rows=[...map.values()].sort((a,b)=>b.points-a.points||b.wins-a.wins||b.birds-a.birds||String(a.member.name).localeCompare(String(b.member.name)));
  const standing=rows.map((x,i)=>`<div class="gr155-recap-row"><span><b>${i+1}</b> ${esc(x.member.name)}</span><span>${x.points} pts</span></div>`).join('')||'<div class="gr155-empty">No points yet.</div>';
  const club=[...rows].sort((a,b)=>b.eagles-a.eagles||b.birds-a.birds).filter(x=>x.eagles||x.birds),eagle=club.map(x=>`<div class="gr155-recap-row"><span>${esc(x.member.name)}</span><span>${x.eagles?`${x.eagles} eagle${x.eagles===1?'':'s'} · `:''}${x.birds} birdie${x.birds===1?'':'s'}</span></div>`).join('')||'<div class="gr155-empty">No confirmed birdies or eagles yet.</div>';
  const intel=[];const latest=[...complete].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];if(latest){const r=standings(latest)[0];if(r)intel.push(`${displayName(p,r.player_name)} finished the latest Mission on top${finite(r.net)?` at net ${Number(r.net)}`:''}.`)}
  if(rows.length){const best=rows[0].points,leaders=rows.filter(x=>x.points===best);intel.push(leaders.length>1?`${leaders.map(x=>x.member.name).join(' & ')} are tied atop the Platoon at ${best} point${best===1?'':'s'}.`:`${leaders[0].member.name} leads the Platoon with ${best} point${best===1?'':'s'}.`);const b=Math.max(...rows.map(x=>x.birds));if(b>0){const bl=rows.filter(x=>x.birds===b);intel.push(`${bl.map(x=>x.member.name).join(' & ')} ${bl.length>1?'share':'holds'} the birdie lead with ${b}.`)}}
  if(!intel.length)intel.push('No completed Missions yet. The season story is still waiting to be written.');
  return `<div class="gr155-recap-grid gr155-platoon-recap"><section class="gr155-recap-block"><div class="gr155-recap-title">PLATOON STANDINGS</div>${standing}</section><section class="gr155-recap-block"><div class="gr155-recap-title">EAGLE CLUB</div>${eagle}</section><section class="gr155-recap-block gr155-recap-copy"><div class="gr155-recap-title">PLATOON INTEL</div>${intel.map(x=>`<p>${esc(x)}</p>`).join('')}</section></div>`;
}
function enhancePlatoonRecap(){const p=getP(),old=document.querySelector('.gr-platoon-standings');if(p&&old)old.outerHTML=platoonRecapMarkup(p)}

function missionIdFromCard'''
          s,n=re.subn(r'function summaryMarkup\(p,m\)\{[\s\S]*?\n\}\n\nfunction missionIdFromCard',replacement,s,count=1)
          assert n==1, 'summaryMarkup replacement failed'
          s=s.replace("function enhanceAll(){document.querySelectorAll('.gr-mission').forEach(enhanceCard);document.querySelectorAll('.gr155-upload-status').forEach(x=>x.remove())}","function enhanceAll(){document.querySelectorAll('.gr-mission').forEach(enhanceCard);document.querySelectorAll('.gr155-upload-status').forEach(x=>x.remove());enhancePlatoonRecap()}")
          s=s.replace("styles();\nlet queued=false;",'''function recapStyles(){if(document.getElementById('gr155RecapStyles'))return;const s=document.createElement('style');s.id='gr155RecapStyles';s.textContent=`.gr155-recap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.gr155-recap-block{border:1px solid var(--line);background:#101914;border-radius:14px;padding:12px;min-width:0}.gr155-recap-title{font-size:9px;font-weight:950;letter-spacing:.12em;color:var(--accent);margin-bottom:9px}.gr155-recap-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:10.5px}.gr155-recap-row:last-child{border-bottom:0}.gr155-recap-row span:last-child{white-space:nowrap;color:#dce6e1;font-weight:800}.gr155-recap-hi{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}.gr155-recap-hi:last-child{border-bottom:0}.gr155-recap-hi span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.gr155-recap-hi strong{display:block;font-size:11px;margin-top:2px}.gr155-recap-copy p{font-size:10.5px;line-height:1.38;margin:0 0 8px;color:#dce6e1}.gr155-recap-copy p:last-child{margin-bottom:0}.gr155-platoon-recap{margin-top:14px}@media(max-width:700px){.gr155-recap-grid{grid-template-columns:1fr}.gr155-recap-block{padding:11px}.gr155-recap-copy p,.gr155-recap-row{font-size:11px}}`;document.head.appendChild(s)}
styles();recapStyles();
let queued=false;''')
          s=s.replace("n.matches?.('.gr-mission')||n.querySelector?.('.gr-mission')","n.matches?.('.gr-mission,.gr-platoon-standings')||n.querySelector?.('.gr-mission,.gr-platoon-standings')")
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check dev-v15.5-results.js
          grep -q 'PLATOON INTEL' dev-v15.5-results.js
          grep -q 'HIGHLIGHTED SCORES' dev-v15.5-results.js
          grep -q 'grid-template-columns:repeat(3' dev-v15.5-results.js
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add dev-v15.5-results.js
          git commit -m 'Revamp Platoon and Mission recaps into three blocks'
          git push