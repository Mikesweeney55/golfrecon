name: Golf Recon v14.11 Platoons Sync Logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1411-platoons-sync-logo.yml'
      - '.github/scripts/v1411_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v14.11
        run: python .github/scripts/v1411_patch.py
      - name: Verify JavaScript and regression guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'Golf Recon v14.11 Beta' in s
          assert 'function gameKeysPregameHtml(){' in s
          assert 'function scoreDifferential(r){' in s
          assert 'function syncPlatoonFromServer(){' in s
          assert 'PLATOON LOGO' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/golfrecon-inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/golfrecon-inline.js
      - name: Commit v14.11
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Add Platoon logo and cross-device sync v14.11'
          git push
