name: Validate Platoon Import Backend

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/platoon-import/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge Function source
        run: |
          grep -q 'const holeDetailSchema=' supabase/functions/platoon-import/index.ts
          grep -q 'async function parseHoleDetails' supabase/functions/platoon-import/index.ts
          grep -q 'parse_hole_details' supabase/functions/platoon-import/index.ts
          python - <<'PY'
          from pathlib import Path
          src=Path('supabase/functions/platoon-import/index.ts').read_text()
          Path('/tmp/platoon-import-check.ts').write_text('// @ts-nocheck\n'+src)
          PY
          deno check /tmp/platoon-import-check.ts
