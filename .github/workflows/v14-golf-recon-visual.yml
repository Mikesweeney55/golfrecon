name: Build Golf Recon v14 Visual Refresh

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_v14_visual.py
      - .github/workflows/v14-golf-recon-visual.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate Golf Recon v14
        run: python scripts/patch_v14_visual.py
      - name: Commit v14 UI
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Golf Recon v14 — Data-Tech + Recon visual refresh" || exit 0
          git push origin HEAD:main
