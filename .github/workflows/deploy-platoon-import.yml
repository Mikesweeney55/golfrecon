name: Deploy Platoon Import Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy-platoon-import-trigger.txt'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vqpqyxamqiamblpcxqxg
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify deployment credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is missing" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show Supabase CLI version
        run: supabase --version
      - name: Apply platoons-v4 hq_meta migration
        run: |
          # Additive column only; IF NOT EXISTS makes this safe to re-run.
          supabase db query --remote="$SUPABASE_PROJECT_ID" --yes -f supabase/platoons-v4-hq-meta.sql
      - name: Deploy platoon-import from main
        run: |
          # Newer CLI requires --yes for non-interactive deploys.
          supabase functions deploy platoon-import --remote="$SUPABASE_PROJECT_ID" --use-api --yes
