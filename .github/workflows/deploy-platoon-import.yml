name: Deploy Platoon Import Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy-platoon-import-trigger.txt'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: vqpqyxamqiamblpcxqxg
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify deployment credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is missing" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply platoons SQL migrations (v4 hq_meta + v5 invite_email)
        run: |
          set -euo pipefail
          apply_sql() {
            local SQL_FILE="$1"
            local LABEL="$2"
            BODY=$(python3 - <<PY
          import json, pathlib
          print(json.dumps({"query": pathlib.Path("$SQL_FILE").read_text()}))
          PY
            )
            HTTP=$(curl -sS -o "/tmp/${LABEL}-migrate.json" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY" || true)
            echo "$LABEL Management API HTTP $HTTP"
            cat "/tmp/${LABEL}-migrate.json" || true
            if [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ]; then
              echo "$LABEL migration applied via Management API"
              return 0
            fi
            if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
              echo "$LABEL Management API failed; retrying with supabase db query + DB password"
              export PGPASSWORD="$SUPABASE_DB_PASSWORD"
              supabase db query --remote="$SUPABASE_PROJECT_ID" --yes -f "$SQL_FILE"
              return 0
            fi
            echo "::error::Could not apply $LABEL. Paste $SQL_FILE in the Supabase SQL editor, or add SUPABASE_DB_PASSWORD repo secret."
            return 1
          }
          apply_sql supabase/platoons-v4-hq-meta.sql hqmeta
          apply_sql supabase/platoons-v5-invite-email.sql inviteemail

  deploy:
    runs-on: ubuntu-latest
    # Function deploy must not wait on migration — frontend already live; edge code is additive.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vqpqyxamqiamblpcxqxg
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify deployment credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is missing" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy platoon-import from main
        run: |
          supabase functions deploy platoon-import --remote="$SUPABASE_PROJECT_ID" --use-api --yes
      - name: Deploy golfiq-import from main
        run: |
          test -f supabase/functions/golfiq-import/index.ts
          supabase functions deploy golfiq-import --remote="$SUPABASE_PROJECT_ID" --use-api --yes
