name: Build GolfRecon v12.9 Satellite Course Preview

on:
  push:
    branches: [v12.9-satellite-preview]
    paths:
      - scripts/patch_v129.py
      - .github/workflows/v129-satellite-preview.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.9-satellite-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v12.9 patch
        run: python scripts/patch_v129.py
      - name: Commit v12.9
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Add satellite imagery to Course Preview for v12.9" || exit 0
          git push origin HEAD:v12.9-satellite-preview
