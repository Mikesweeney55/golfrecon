name: Download golfiq-import source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vqpqyxamqiamblpcxqxg
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "missing SUPABASE_ACCESS_TOKEN" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download function
        run: |
          set -euo pipefail
          mkdir -p /tmp/fn-out
          # Prefer CLI download; fall back to Management API
          if supabase functions download golfiq-import --project-ref "$SUPABASE_PROJECT_ID" 2>/tmp/dl.err; then
            echo "CLI download ok"
            find . -path '*golfiq-import*' -type f | head -50
            cp -a supabase/functions/golfiq-import /tmp/fn-out/ 2>/dev/null || \
              find . -type d -name golfiq-import -exec cp -a {} /tmp/fn-out/ \;
          else
            cat /tmp/dl.err || true
            echo "Trying Management API body…"
            curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/golfiq-import/body" \
              -o /tmp/fn-out/index.ts
            wc -c /tmp/fn-out/index.ts
          fi
          ls -laR /tmp/fn-out
      - uses: actions/upload-artifact@v4
        with:
          name: golfiq-import-source
          path: /tmp/fn-out
