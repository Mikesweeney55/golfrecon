name: Golf Recon v14.6 Handicap and Scrambling

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_v146_handicap_scrambling.py
      - .github/workflows/v146-handicap-scrambling.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v14.6 updates and validate
        run: python scripts/patch_v146_handicap_scrambling.py
      - name: Commit v14.6
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Golf Recon v14.6 — handicap graph and scrambling counts" || exit 0
          git push origin HEAD:main
