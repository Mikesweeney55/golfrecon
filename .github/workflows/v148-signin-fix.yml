name: Golf Recon v14.8 Sign-in Compatibility Fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_v148_signin_password.py
      - .github/workflows/v148-signin-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/fix_v148_signin_password.py
      - run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Golf Recon v14.8 — preserve existing sign-in passwords" || exit 0
          git push origin HEAD:main
