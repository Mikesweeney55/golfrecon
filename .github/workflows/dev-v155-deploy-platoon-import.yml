name: Deploy v15.5 Platoon Import

on:
  push:
    branches:
      - dev-v15.5-platoon-results
    paths:
      - dev-v155-deploy-platoon-import-trigger.txt

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vqpqyxamqiamblpcxqxg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v15.5-platoon-results
      - name: Verify deployment credential
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is missing" && exit 1)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy platoon-import
        run: supabase functions deploy platoon-import --project-ref "$SUPABASE_PROJECT_ID" --use-api
