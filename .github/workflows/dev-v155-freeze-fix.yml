name: Fix v15.5 Platoons Freeze

on:
  push:
    branches:
      - dev-v15.5-platoon-results
    paths:
      - scripts/fix_v155_platoon_freeze.py
      - dev-v155-freeze-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev-v15.5-platoon-results

      - name: Patch observer loop
        run: |
          python scripts/fix_v155_platoon_freeze.py
          node --check dev-v15.5-results.js
          grep -q 'scheduleEnhanceAll' dev-v15.5-results.js
          git diff --check

      - name: Commit validated freeze fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-v15.5-results.js
          git diff --cached --quiet || git commit -m "Fix v15.5 Platoons observer freeze"
          git push origin HEAD:dev-v15.5-platoon-results
