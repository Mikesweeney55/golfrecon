name: Build GolfRecon v13.1 Interactive Course Preview

on:
  push:
    branches: [v13.1-interactive-map]
    paths:
      - scripts/patch_v131.py
      - .github/workflows/v131-interactive-map.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13.1-interactive-map
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.1 patch
        run: python scripts/patch_v131.py
      - name: Commit v13.1
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.1 interactive Course Preview" || exit 0
          git push origin HEAD:v13.1-interactive-map
