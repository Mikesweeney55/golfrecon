name: Consolidate Platoons
on:
  push:
    paths:
      - 'consolidate-platoons-trigger.txt'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate Platoons code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          real=Path('platoons-v15-real.js')
          v5=Path('platoons-v15-patch-v5.js')
          v6=Path('platoons-v15-patch-v6.js')
          combined=real.read_text().rstrip()+"\n\n/* Integrated Platoons navigation/mobile fixes */\n"+v5.read_text().strip()+"\n\n/* Integrated Mission scoring/results enhancements */\n"+v6.read_text().strip()+"\n"
          combined=combined.replace("'\"':'&quot'","'\"':'&quot;'")
          real.write_text(combined)

          index=Path('index.html')
          s=index.read_text()
          import re
          s=re.sub(r'<script src="platoons-v15-real\.js\?v=[^"]+"></script>', '<script src="platoons-v15-real.js?v=160"></script>', s)
          s=s.replace('  <script src="platoons-v15-patch-v5.js"></script>\n','')
          s=re.sub(r'\s*<script src="platoons-v15-patch-v6\.js\?v=[^"]+"></script>\n?', '\n', s)
          index.write_text(s)

          for f in ['platoons-v15-patch.js','platoons-v15-patch-v4.js','platoons-v15-patch-v5.js','platoons-v15-patch-v6.js']:
              p=Path(f)
              if p.exists(): p.unlink()
          PY
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consolidate Platoons into single production script"
          git push
