name: Golf Recon v14.10 Platoons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1410-platoons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Platoons v14.10
        run: python .github/scripts/v1410_patch.py
      - name: Verify JavaScript and regression guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/golfrecon-v1410.js').write_text('\n'.join(x for x in scripts if x.strip()))
          required=['Golf Recon v14.10 Beta','function gameKeysPregameHtml(){','function scoreDifferential(r){','PLATOON_LOCAL_KEY','openMissionImport','Platoon Chief','Co-Chief']
          for t in required: assert t in s,t
          PY
          node --check /tmp/golfrecon-v1410.js
      - name: Commit v14.10
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Build Platoons setup missions calendar and results import UI v14.10'
          git push
