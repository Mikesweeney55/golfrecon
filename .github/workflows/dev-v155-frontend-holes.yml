name: Build v15.5 Frontend Hole Detail

on:
  push:
    branches:
      - dev-v15.5-platoon-results
    paths:
      - dev-v155-frontend-holes-trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev-v15.5-platoon-results

      - name: Patch frontend hole detail flow
        run: |
          python scripts/patch_v155_frontend_holes.py
          git diff --check
          grep -q "action:'parse_hole_details'" dev-v15.5-results.js
          grep -q 'function openHoleDetailImport' dev-v15.5-results.js
          grep -q 'hole_detail_saved_at' dev-v15.5-results.js

      - name: Validate JavaScript
        run: node --check dev-v15.5-results.js

      - name: Commit validated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-v15.5-results.js
          git diff --cached --quiet || git commit -m "Add true Platoon hole-by-hole detail flow"
          git push origin HEAD:dev-v15.5-platoon-results
