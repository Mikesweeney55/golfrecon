name: Golf Recon v14.9 Platoons Foundation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/platoons-v149.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Platoons UI
        run: python scripts/platoons_v149_patch.py
      - name: Verify
        run: |
          grep -q 'Golf Recon v14.9 Beta' index.html
          grep -q 'PLATOON HQ' index.html
          grep -q 'MISSION CALENDAR' index.html
          grep -q 'CLUB EAGLE' index.html
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Build Platoons foundation UI for v14.9'
          git push
# trigger after patch-target fix
