name: Build GolfRecon v13.4 Pregame Hole Insights

on:
  push:
    branches: [v13.4-pregame-hole-insights]
    paths:
      - scripts/patch_v134.py
      - .github/workflows/v134-pregame-hole-insights.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13.4-pregame-hole-insights
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.4 patch
        run: python scripts/patch_v134.py
      - name: Commit v13.4
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.4 — Embed Hole Insights in Pregame" || exit 0
          git push origin HEAD:v13.4-pregame-hole-insights
