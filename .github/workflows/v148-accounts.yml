name: Golf Recon v14.8 Account Hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_v148_accounts.py
      - .github/workflows/v148-accounts.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply account hardening patch
        run: python scripts/patch_v148_accounts.py
      - name: Commit v14.8
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Golf Recon v14.8 — harden account signup and recovery" || exit 0
          git push origin HEAD:main
