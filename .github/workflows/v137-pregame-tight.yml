name: Build GolfRecon v13.7 Tighter Pregame Header

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_v137.py
      - .github/workflows/v137-pregame-tight.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.7 patch
        run: python scripts/patch_v137.py
      - name: Commit v13.7
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.7 — Tighten sticky Pregame header" || exit 0
          git push origin HEAD:main
