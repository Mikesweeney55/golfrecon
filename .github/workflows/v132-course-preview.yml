name: Build GolfRecon v13.2 Course Preview Tune

on:
  push:
    branches: [v13.2-course-preview-tune]
    paths:
      - scripts/patch_v132.py
      - .github/workflows/v132-course-preview.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v13.2-course-preview-tune
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate v13.2 patch
        run: python scripts/patch_v132.py
      - name: Commit v13.2
        run: |
          git config user.name "github-actions-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "GolfRecon v13.2 Course Preview tune" || exit 0
          git push origin HEAD:v13.2-course-preview-tune
