name: Integrate Platoons v15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-platoons-v15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Platoons v15 into the real app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Golf Recon v14.11 Beta','Golf Recon v15.4 Beta')
          s=s.replace('v14.11 Beta','v15.4 Beta')
          css='<link rel="stylesheet" href="platoons-v15-real.css?v=154">'
          js='<script src="platoons-v15-real.js?v=154"></script>'
          if css not in s:
              s=s.replace('</head>',f'  {css}\n</head>')
          if js not in s:
              s=s.replace('</body>',f'  {js}\n</body>')
          p.write_text(s)
          PY
      - name: Commit production integration
        run: |
          git config user.name "Golf Recon Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate Platoons v15 into main app"
          git push