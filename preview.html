<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Golf Recon v15.5 Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1412}
    #previewApp{display:block;width:100%;height:100dvh;border:0;background:#0d1412}
  </style>
</head>
<body>
  <iframe id="previewApp" title="Golf Recon v15.5 Preview" src="index.html?preview=155"></iframe>
  <script>
    const frame=document.getElementById('previewApp');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.getElementById('grPreviewSandboxLoader'))return;
        const s=doc.createElement('script');
        s.id='grPreviewSandboxLoader';
        s.src='dev-preview-sandbox.js?v=155';
        doc.body.appendChild(s);
      }catch(err){console.error('Preview sandbox failed to load',err)}
    });
  </script>
</body>
</html>
