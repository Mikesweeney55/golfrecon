<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Recon v15.3 Platoons</title>
<style>
:root{--bg:#0d1412;--panel:#15201c;--panel2:#1d2b26;--line:#2a3a34;--text:#f5f7f6;--muted:#9eb0a8;--accent:#b8ea68;--good:#72e090;--gold:#ffd98a;--shadow:0 14px 32px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3228 0,#0d1412 38%),var(--bg);color:var(--text);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding:16px 14px 100px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.brand{text-align:center;font-size:23px;font-weight:950;letter-spacing:.12em}.version{font-size:10px;color:var(--muted);justify-self:end}.button{border:0;border-radius:11px;padding:9px 12px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:#14200f}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.card{background:rgba(21,32,28,.95);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.hq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;background:radial-gradient(circle at 90% 0,rgba(184,234,104,.09),transparent 35%),linear-gradient(145deg,#102019,#0b1511)}.eyebrow{font-size:9px;letter-spacing:.16em;color:var(--accent);font-weight:900}.platoon-name{font-size:30px;font-weight:950;line-height:1;margin:5px 0}.motto{font-weight:800;color:#dce7e1}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#24352e;color:#dce8e2;font-size:10px;font-weight:800}.hq-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.platoon-logo{width:78px;height:78px;border-radius:16px;border:1px solid var(--line);background:#0b1511;object-fit:cover}.logo-placeholder{width:78px;height:78px;border-radius:16px;border:1px dashed #52685d;display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;padding:8px}.section{margin-top:14px}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 2px 8px}.section-title h2{font-size:18px;margin:0}.stack{display:grid;gap:9px}.mission-card{background:#101914;border:1px solid var(--line);border-radius:16px;padding:12px}.mission-card.featured{border-color:rgba(184,234,104,.38);background:linear-gradient(145deg,#102019,#0d1713)}.mission-head{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center}.date-tile{border:1px solid var(--line);border-radius:12px;background:#0c1512;text-align:center;padding:7px 4px;line-height:1}.date-tile .mon{font-size:8px;color:var(--accent);font-weight:900;letter-spacing:.1em}.date-tile .day{font-size:22px;font-weight:950;margin:3px 0}.date-tile .dow{font-size:8px;color:var(--muted);font-weight:800}.mission-title{font-size:17px;font-weight:900;line-height:1.15}.mission-course{font-size:11px;color:#dce6e1;margin-top:3px}.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.meta{border:1px solid rgba(255,255,255,.06);background:#0d1713;border-radius:10px;padding:7px 8px;min-width:0}.meta span{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.meta strong{display:block;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.players{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.player-chip{font-size:9px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#13211b}.player-chip.guest{border-style:dashed;color:var(--gold)}.mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini-actions .button{padding:7px 9px;font-size:9px}.preview,.summary{margin-top:9px;padding:9px 10px;background:#0d1713;border-radius:0 11px 11px 0}.preview{border-left:3px solid var(--accent)}.summary{border-left:3px solid var(--good)}.preview h4,.summary h4{margin:0 0 5px;font-size:12px}.preview p,.summary p{font-size:10px;color:#dce6e1;margin:0 0 5px}.draft{color:#f2d335;border:1px solid rgba(242,211,53,.3);background:rgba(242,211,53,.08)}.ready{color:var(--accent);border:1px solid rgba(184,234,104,.3);background:rgba(184,234,104,.07)}.complete{color:var(--good);border:1px solid rgba(111,225,143,.3);background:rgba(111,225,143,.07)}.war{color:#ffcf68;border:1px solid rgba(255,207,104,.35);background:rgba(255,207,104,.08)}.war-card{margin-top:10px}.war-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.war-head h3{margin:2px 0 0}.progress{height:7px;background:#0c1512;border-radius:999px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--accent)}.leaderboard{width:100%;border-collapse:collapse;margin-top:8px}.leaderboard th,.leaderboard td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}.leaderboard th{font-size:8px;color:var(--muted);text-transform:uppercase}.leaderboard td:nth-child(n+2),.leaderboard th:nth-child(n+2){text-align:right}.archive-row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}.archive-row:last-child{border-bottom:0}.archive-actions{display:flex;gap:5px}.archive-actions .button{padding:6px 8px;font-size:8px}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.96);backdrop-filter:blur(14px);border:1px solid rgba(207,232,219,.42);border-radius:20px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.32)}.nav{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:13px}.nav span{display:block;font-size:18px}.nav small{font-size:11px}.nav.active{background:#24342e;color:var(--text)}dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(640px,calc(100% - 24px))}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog{max-height:calc(100dvh - 28px);overflow:auto;background:#16221d;border:1px solid var(--line);border-radius:22px;padding:18px}.dialog-head{display:flex;justify-content:space-between;gap:10px}.dialog-head h2{margin:3px 0}.x{border:0;background:transparent;color:var(--text);font-size:20px}.event-banner{margin-top:10px;background:linear-gradient(145deg,#0f1d17,#0b1511);border:1px solid var(--line);border-radius:15px;padding:12px}.event-banner .event-name{font-size:20px;font-weight:950}.event-course{font-size:12px;color:#dce6e1;margin-top:3px}.event-facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.event-fact{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#13211b}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:grid;gap:5px;margin-top:10px;font-weight:750;font-size:11px}input,select,textarea{width:100%;background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}textarea{min-height:70px}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}.check{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#101914;padding:8px;font-size:10px}.check input{width:auto;margin:0}.guest-add{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.guest-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.guest-pill{display:flex;gap:5px;align-items:center;border:1px dashed #6d6140;border-radius:999px;padding:5px 7px;font-size:9px;color:var(--gold)}.guest-pill button{border:0;background:transparent;color:var(--gold);padding:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.logo-upload{border:1px dashed #52685d;border-radius:14px;padding:12px;text-align:center;background:#101914;margin-top:9px}.logo-upload input{display:none}.radio-list{display:grid;gap:6px;margin-top:8px}.radio{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;background:#101914}.radio input{width:auto}@media(max-width:700px){.mission-head{grid-template-columns:54px minmax(0,1fr)}.mission-head>.tag{grid-column:2;justify-self:start}.meta-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.archive-row{grid-template-columns:50px minmax(0,1fr)}.archive-actions{grid-column:2}.check-grid{grid-template-columns:1fr 1fr}.platoon-logo,.logo-placeholder{width:66px;height:66px}}
</style>
</head>
<body><div class="app"><div class="top"><div></div><div class="brand">GOLF RECON</div><div class="version">v15.3 Preview</div></div><main id="app"></main></div>
<nav class="bottom-nav"><button class="nav"><span>⛳</span><small>Pregame</small></button><button class="nav"><span>📊</span><small>Rounds</small></button><button class="nav active"><span>👥</span><small>Platoons</small></button><button class="nav"><span>🏌️</span><small>My Game</small></button></nav>
<script>
const K='golfrecon-platoons-v15-preview';
const roster=['Mike S.','Sully','Chuck','Cunny','Mannke','Steve'];
const defaults={name:'My Time',motto:"It's Not About The Golf",season:2026,cadets:6,visibility:'Private',logo:'',wars:[],missions:[{id:'m1',title:'Sunday Funday',date:'2026-09-20',time:'08:10',course:'Windham Country Club',format:'Net stroke play',players:['Mike S.','Sully','Chuck','Cunny'],guests:[],status:'draft',preview:null,results:null}]};
let data=(()=>{try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return structuredClone(defaults)}})();
const save=()=>localStorage.setItem(K,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtTime=v=>{if(!v)return 'TBD';const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};
function dateTile(v){if(!v)return '<div class="date-tile"><div class="day">—</div><div class="dow">TBD</div></div>';const d=new Date(v+'T12:00:00');return `<div class="date-tile"><div class="mon">${d.toLocaleString(undefined,{month:'short'}).toUpperCase()}</div><div class="day">${d.getDate()}</div><div class="dow">${d.toLocaleString(undefined,{weekday:'short'}).toUpperCase()}</div></div>`}
function allMissions(){return [...(data.missions||[]),...(data.wars||[]).flatMap(w=>(w.missions||[]).map(m=>({...m,warId:w.id,warTitle:w.title})))]}
function findMission(id,warId=''){if(warId){const w=(data.wars||[]).find(x=>x.id===warId);return {m:w?.missions?.find(x=>x.id===id),w}}return {m:(data.missions||[]).find(x=>x.id===id),w:null}}
function statusTag(s){return `<span class="tag ${s==='completed'?'complete':s==='ready'?'ready':'draft'}">${s==='completed'?'COMPLETE':s==='ready'?'READY':'DRAFT'}</span>`}
function missionPeople(m){return [...(m.players||[]).map(name=>({name,guest:false})),...(m.guests||[]).map(name=>({name,guest:true}))]}
function createPreview(m){return {battlefield:`${m.course||'Course TBD'} · ${m.format||'Format TBD'}`,watch:`${missionPeople(m).map(x=>x.name).slice(0,3).join(', ')||'Field TBD'}`,history:'Course history and player trends will populate here from Golf Recon data.'}}
function missionCard(m,war=null,featured=false){const people=missionPeople(m);return `<div class="mission-card ${featured?'featured':''}"><div class="mission-head">${dateTile(m.date)}<div><div class="mission-title">${esc(m.title||'Untitled Mission')}</div><div class="mission-course">${esc(m.course||'Course TBD')}</div></div>${statusTag(m.status)}</div><div class="meta-grid"><div class="meta"><span>Tee</span><strong>${esc(fmtTime(m.time))}</strong></div><div class="meta"><span>Format</span><strong>${esc(m.format||'TBD')}</strong></div><div class="meta"><span>Players</span><strong>${people.length}</strong></div></div><div class="players">${people.map(p=>`<span class="player-chip ${p.guest?'guest':''}">${esc(p.name)}${p.guest?' · GUEST':''}</span>`).join('')}</div>${m.preview&&m.status!=='completed'?`<div class="preview"><h4>🛰️ Preview</h4><p>${esc(m.preview.battlefield)}</p><p>${esc(m.preview.watch)}</p></div>`:''}${m.status==='completed'?`<div class="summary"><h4>After Action</h4><p>${summaryText(m)}</p></div>`:''}<div class="mini-actions">${m.status==='draft'?`<button class="button primary" onclick="lockMission('${m.id}','${war?.id||''}')">Create Preview</button>`:`<button class="button secondary" onclick="viewPreview('${m.id}','${war?.id||''}')">Preview</button>`}<button class="button secondary" onclick="openMissionEditor('${m.id}','${war?.id||''}')">Edit</button><button class="button secondary" onclick="openScores('${m.id}','${war?.id||''}')">Scores</button></div></div>`}
function summaryText(m){if(!m.results?.length)return 'Mission complete.';const best=[...m.results].sort((a,b)=>(a.gross||999)-(b.gross||999))[0];return best?`${esc(best.name)} · ${best.gross} gross`:'Mission complete.'}
function renderWar(w){const ms=w.missions||[],done=ms.filter(m=>m.status==='completed').length,next=ms.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];return `<section class="card war-card"><div class="war-head"><div><div class="eyebrow">WAR</div><h3>${esc(w.title||'Unnamed War')}</h3></div><span class="tag war">${done}/${ms.length}</span></div><div class="progress"><span style="width:${ms.length?done/ms.length*100:0}%"></span></div>${next?missionCard(next,w,true):''}${ms.filter(m=>m.id!==next?.id).map(m=>missionCard(m,w,false)).join('')}</section>`}
function render(){const stand=[...(data.missions||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date))),upcoming=stand.filter(m=>m.status!=='completed'),completed=stand.filter(m=>m.status==='completed').sort((a,b)=>String(b.date).localeCompare(String(a.date))),latest=completed[0],older=completed.slice(1);document.getElementById('app').innerHTML=`<section class="card hq"><div><div class="eyebrow">PLATOON</div><div class="platoon-name">${esc(data.name)}</div><div class="motto">${esc(data.motto)}</div><div class="badges"><span class="badge">${data.season}</span><span class="badge">${esc(data.visibility)}</span></div><div class="hq-actions"><button class="button secondary" onclick="openSetup()">Setup</button><button class="button primary" onclick="openMissionEditor()">+ Mission</button><button class="button secondary" onclick="openWarEditor()">+ War</button></div></div><div>${data.logo?`<img class="platoon-logo" src="${data.logo}" alt="Platoon logo">`:'<div class="logo-placeholder">PLATOON<br>LOGO</div>'}</div></section>${upcoming.length?`<section class="section"><div class="section-title"><h2>Upcoming</h2></div><div class="stack">${upcoming.map((m,i)=>missionCard(m,null,i===0)).join('')}</div></section>`:''}${(data.wars||[]).map(renderWar).join('')}${latest?`<section class="section"><div class="section-title"><h2>Latest</h2></div>${missionCard(latest,null,true)}</section>`:''}${older.length?`<section class="section card"><div class="section-title"><h2>Mission History</h2></div>${older.map(m=>`<div class="archive-row">${dateTile(m.date)}<div><div class="mission-title">${esc(m.title||'Mission')}</div><div class="mission-course">${esc(m.course||'')}</div></div><div class="archive-actions"><button class="button secondary" onclick="viewPreview('${m.id}')">Preview</button><button class="button secondary" onclick="viewAfter('${m.id}')">Post-Game</button></div></div>`).join('')}</section>`:''}`}
function openSetup(){document.body.insertAdjacentHTML('beforeend',`<dialog id="dlg"><div class="dialog"><div class="dialog-head"><div><div class="eyebrow">PLATOON SETUP</div><h2>${esc(data.name)}</h2></div><button class="x" onclick="closeDlg()">✕</button></div><label>Platoon name<input id="pname" value="${esc(data.name)}"></label><label>Motto<input id="pmotto" value="${esc(data.motto)}"></label><div class="form-grid"><label>Season<input id="pseason" type="number" value="${data.season}"></label><label>Visibility<select id="pvis"><option ${data.visibility==='Private'?'selected':''}>Private</option><option ${data.visibility==='Public'?'selected':''}>Public</option></select></label></div><label>Logo</label><div class="logo-upload"><label style="margin:0;cursor:pointer">Choose image<input id="plogo" type="file" accept="image/*" onchange="loadLogo(this)"></label>${data.logo?'<div style="margin-top:8px"><button class="button secondary" onclick="removeLogo()">Remove logo</button></div>':''}</div><div class="dialog-actions"><button class="button secondary" onclick="closeDlg()">Cancel</button><button class="button primary" onclick="saveSetup()">Save</button></div></div></dialog>`);dlg.showModal()}
let pendingLogo=null;function loadLogo(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=240,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingLogo=c.toDataURL('image/jpeg',.82)};img.src=e.target.result};r.readAsDataURL(f)}
function removeLogo(){data.logo='';pendingLogo='';save();closeDlg();render()}
function saveSetup(){data.name=pname.value.trim()||data.name;data.motto=pmotto.value.trim();data.season=Number(pseason.value)||data.season;data.visibility=pvis.value;if(pendingLogo!==null)data.logo=pendingLogo;pendingLogo=null;save();closeDlg();render()}
function openMissionEditor(id='',warId=''){const {m,w}=id?findMission(id,warId):{m:null,w:warId?(data.wars||[]).find(x=>x.id===warId):null};const x=m||{id:'m'+Date.now(),title:'',date:'',time:'',course:'',format:'Net stroke play',players:[],guests:[],status:'draft',preview:null,results:null};window.editCtx={x,w,isNew:!m,warId};window.editGuests=[...(x.guests||[])];document.body.insertAdjacentHTML('beforeend',`<dialog id="dlg"><div class="dialog"><div class="dialog-head"><div><div class="eyebrow">${m?'EDIT MISSION':'NEW MISSION'}</div><h2>${esc(x.title||'Mission')}</h2></div><button class="x" onclick="closeDlg()">✕</button></div><div class="event-banner"><div class="event-name" id="bannerName">${esc(x.title||'Event name')}</div><div class="event-course" id="bannerCourse">${esc(x.course||'Course TBD')}</div><div class="event-facts"><span class="event-fact" id="bannerDate">${esc(x.date||'Date TBD')}</span><span class="event-fact" id="bannerTime">${esc(fmtTime(x.time))}</span><span class="event-fact" id="bannerFormat">${esc(x.format||'Format TBD')}</span></div></div><label>Event name<input id="mtitle" value="${esc(x.title)}" oninput="syncBanner()"></label><label>Course<input id="mcourse" value="${esc(x.course)}" oninput="syncBanner()"></label><div class="form-grid"><label>Date<input id="mdate" type="date" value="${esc(x.date)}" oninput="syncBanner()"></label><label>Tee time<input id="mtime" type="time" value="${esc(x.time||'')}" oninput="syncBanner()"></label></div><label>Format<input id="mformat" value="${esc(x.format||'')}" oninput="syncBanner()"></label><label>Cadets</label><div class="check-grid">${roster.map(p=>`<label class="check"><input type="checkbox" name="cadet" value="${esc(p)}" ${(x.players||[]).includes(p)?'checked':''}>${esc(p)}</label>`).join('')}</div><label>Guests</label><div class="guest-add"><input id="guestName" placeholder="Guest name"><button class="button secondary" onclick="addGuest()">Add</button></div><div id="guestList" class="guest-list"></div><div class="dialog-actions"><button class="button secondary" onclick="closeDlg()">Cancel</button><button class="button primary" onclick="saveMission()">Save</button></div></div></dialog>`);renderGuests();dlg.showModal()}
function syncBanner(){bannerName.textContent=mtitle.value||'Event name';bannerCourse.textContent=mcourse.value||'Course TBD';bannerDate.textContent=mdate.value||'Date TBD';bannerTime.textContent=fmtTime(mtime.value);bannerFormat.textContent=mformat.value||'Format TBD'}
function renderGuests(){const el=document.getElementById('guestList');if(el)el.innerHTML=window.editGuests.map((g,i)=>`<span class="guest-pill">${esc(g)} <button onclick="removeGuest(${i})">✕</button></span>`).join('')}
function addGuest(){const v=guestName.value.trim();if(!v)return;window.editGuests.push(v);guestName.value='';renderGuests()}
function removeGuest(i){window.editGuests.splice(i,1);renderGuests()}
function saveMission(){const {x,w,isNew}=window.editCtx;x.title=mtitle.value.trim();x.course=mcourse.value.trim();x.date=mdate.value;x.time=mtime.value;x.format=mformat.value.trim();x.players=[...document.querySelectorAll('input[name=cadet]:checked')].map(el=>el.value);x.guests=[...window.editGuests];if(isNew){if(w)w.missions=(w.missions||[]).concat(x);else data.missions=(data.missions||[]).concat(x)}save();closeDlg();render()}
function lockMission(id,warId=''){const {m}=findMission(id,warId);if(!m)return;m.preview=createPreview(m);m.status='ready';save();render()}
function viewPreview(id,warId=''){const {m}=findMission(id,warId);if(!m)return;alert(`PRE-MISSION PREVIEW\n\n${m.title}\n${m.course}\n${fmtTime(m.time)}\n\n${m.preview?.battlefield||'Preview not generated yet.'}\n${m.preview?.watch||''}`)}
function viewAfter(id,warId=''){const {m}=findMission(id,warId);if(!m)return;alert(`AFTER ACTION\n\n${m.title}\n${m.course}\n\n${summaryText(m)}`)}
function openScores(id,warId=''){const {m}=findMission(id,warId);if(!m)return;const people=missionPeople(m);document.body.insertAdjacentHTML('beforeend',`<dialog id="dlg"><div class="dialog"><div class="dialog-head"><div><div class="eyebrow">SCORES</div><h2>${esc(m.title)}</h2></div><button class="x" onclick="closeDlg()">✕</button></div><div class="event-banner"><div class="event-name">${esc(m.title)}</div><div class="event-course">${esc(m.course)}</div><div class="event-facts"><span class="event-fact">${esc(m.date||'Date TBD')}</span><span class="event-fact">${esc(fmtTime(m.time))}</span><span class="event-fact">${esc(m.format||'')}</span></div></div><div class="radio-list">${people.map((p,i)=>`<label class="radio"><input type="radio" name="scorePlayer" value="${i}" ${i===0?'checked':''}>${esc(p.name)}${p.guest?' · Guest':''}</label>`).join('')}</div><label>Gross score<input id="gross" type="number" inputmode="numeric"></label><label>War points<input id="pts" type="number" inputmode="numeric"></label><div class="dialog-actions"><button class="button secondary" onclick="closeDlg()">Cancel</button><button class="button primary" onclick="saveScore('${id}','${warId}')">Save Result</button></div></div></dialog>`);dlg.showModal()}
function saveScore(id,warId=''){const {m}=findMission(id,warId),people=missionPeople(m),idx=Number(document.querySelector('input[name=scorePlayer]:checked')?.value||0),p=people[idx];if(!p)return;m.results=m.results||[];m.results=m.results.filter(r=>r.name!==p.name);m.results.push({name:p.name,gross:Number(gross.value)||null,points:Number(pts.value)||0});m.status='completed';save();closeDlg();render()}
function openWarEditor(){const title=prompt('War name');if(!title)return;data.wars=data.wars||[];data.wars.push({id:'w'+Date.now(),title,missions:[],status:'draft'});save();render()}
function closeDlg(){const d=document.getElementById('dlg');if(d){d.close();d.remove()}}
render();
</script>
</body></html>
