<style>
:root{--bg:#0d1412;--panel:#15201c;--panel2:#1d2b26;--line:#2a3a34;--text:#f5f7f6;--muted:#9eb0a8;--accent:#b8ea68;--accent2:#83c94f;--warning:#ffd400;--blue:#7edbff;--good:#6fe18f;--shadow:0 14px 32px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3228 0,#0d1412 38%),var(--bg);color:var(--text);font:15px/1.42 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding:16px 14px 100px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}.brand{text-align:center;font-size:23px;font-weight:950;letter-spacing:.12em}.version{font-size:10px;color:var(--muted);justify-self:end}.eyebrow{font-size:9px;letter-spacing:.16em;color:var(--accent);font-weight:900}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 9px}.section-head h2{margin:2px 0 0;font-size:21px}.actions{display:flex;gap:7px;flex-wrap:wrap}.button{border:0;border-radius:11px;padding:9px 12px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:#14200f}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.card{background:rgba(21,32,28,.94);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.command{background:radial-gradient(circle at 88% 0,rgba(56,201,255,.08),transparent 36%),linear-gradient(145deg,rgba(13,31,22,.98),rgba(7,19,14,.98))}.title{font-size:28px;line-height:1;margin:5px 0}.motto{font-weight:800;color:#dbe8e1}.admin{font-size:10px;color:var(--muted);margin-top:8px;display:flex;gap:13px;flex-wrap:wrap}.admin strong{color:#eaf2ee}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.badge,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#24352e;color:#dce8e2;font-size:10px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.kpi{background:#101914;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.kpi strong{display:block;font-size:19px}.kpi span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em}.stack{display:grid;gap:10px}.mission-shell{margin-top:12px}.mission-card{background:#101914;border:1px solid var(--line);border-radius:16px;padding:12px}.mission-card.featured{border-color:rgba(184,234,104,.38);background:linear-gradient(145deg,#102019,#0d1713)}.mission-head{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:11px;align-items:center}.date-tile{border:1px solid var(--line);border-radius:12px;background:#0c1512;text-align:center;padding:7px 4px;line-height:1}.date-tile .mon{font-size:8px;color:var(--accent);font-weight:900;letter-spacing:.1em}.date-tile .day{font-size:23px;font-weight:950;margin:3px 0}.date-tile .dow{font-size:8px;color:var(--muted);font-weight:800}.mission-title{font-size:17px;font-weight:900;line-height:1.15}.mission-course{font-size:11px;color:#dce6e1;margin-top:3px}.mission-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.meta-cell{border:1px solid rgba(255,255,255,.06);background:#0d1713;border-radius:10px;padding:7px 8px;min-width:0}.meta-cell span{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.meta-cell strong{display:block;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.players{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.player-chip{font-size:9px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:#13211b}.player-chip.guest{border-style:dashed;color:#ffd98a}.mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini-actions .button{padding:7px 9px;font-size:9px}.preview{margin-top:9px;border-left:3px solid var(--accent);padding:9px 10px;background:#0d1713;border-radius:0 11px 11px 0}.preview h4{margin:0 0 5px;font-size:12px}.preview p{font-size:10px;color:#dce6e1;margin:0 0 6px}.summary{margin-top:9px;border-left:3px solid var(--good);padding:9px 10px;background:#0d1713;border-radius:0 11px 11px 0}.summary h4{margin:0 0 5px;font-size:12px}.summary p{font-size:10px;color:#dce6e1;margin:0}.draft{color:#f2d335;border:1px solid rgba(242,211,53,.3);background:rgba(242,211,53,.08)}.ready{color:var(--accent);border:1px solid rgba(184,234,104,.3);background:rgba(184,234,104,.07)}.complete{color:var(--good);border:1px solid rgba(111,225,143,.3);background:rgba(111,225,143,.07)}.war{color:#ffcf68;border:1px solid rgba(255,207,104,.35);background:rgba(255,207,104,.08)}.war-card{margin-top:12px}.war-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.war-head h3{margin:2px 0 0}.progress{height:7px;background:#0c1512;border-radius:999px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.leaderboard{width:100%;border-collapse:collapse;margin-top:8px}.leaderboard th,.leaderboard td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}.leaderboard th{font-size:8px;color:var(--muted);text-transform:uppercase}.leaderboard td:nth-child(n+2),.leaderboard th:nth-child(n+2){text-align:right}.archive-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.archive-row:last-child{border-bottom:0}.archive-row .mission-title{font-size:13px}.archive-row .mission-course{font-size:9px}.archive-actions{display:flex;gap:5px}.archive-actions .button{padding:6px 8px;font-size:8px}.toggle{width:100%;margin-top:8px}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.96);backdrop-filter:blur(14px);border:1px solid rgba(207,232,219,.42);border-radius:20px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.32)}.nav{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:13px}.nav span{display:block;font-size:18px}.nav small{font-size:11px}.nav.active{background:#24342e;color:var(--text)}dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(640px,calc(100% - 24px))}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog{max-height:calc(100dvh - 28px);overflow:auto;background:#16221d;border:1px solid var(--line);border-radius:22px;padding:19px}.dialog-head{display:flex;justify-content:space-between;gap:10px}.dialog-head h2{margin:3px 0}.x{border:0;background:transparent;color:var(--text);font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:grid;gap:5px;margin-top:10px;font-weight:750;font-size:11px}input,select,textarea{width:100%;background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}textarea{min-height:70px}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px}.check{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#101914;padding:8px;font-size:10px}.check input{width:auto;margin:0}.guest-add{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.guest-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.guest-pill{display:flex;gap:5px;align-items:center;border:1px dashed #6d6140;border-radius:999px;padding:5px 7px;font-size:9px;color:#ffd98a}.guest-pill button{border:0;background:transparent;color:#ffd98a;padding:0}.radio-list{display:grid;gap:6px;margin-top:8px}.radio{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;background:#101914}.radio input{width:auto}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{font-size:10px;color:var(--muted);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#101914;margin-top:10px}.upload{border:1px dashed #52685d;border-radius:15px;padding:18px;text-align:center;background:#101914;margin-top:12px}.upload input{display:none}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.mission-head{grid-template-columns:58px minmax(0,1fr);}.mission-head>.tag{grid-column:2;justify-self:start}.mission-meta-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.archive-row{grid-template-columns:54px minmax(0,1fr)}.archive-actions{grid-column:2}.check-grid{grid-template-columns:1fr 1fr}}
</style>

<body><div class="app"><div class="top"><div></div><div class="brand">GOLF RECON</div><div class="version">v15.2 Preview</div></div><main id="app"></main></div>
<nav class="bottom-nav"><button class="nav"><span>⛳</span><small>Pregame</small></button><button class="nav"><span>📊</span><small>Rounds</small></button><button class="nav active"><span>👥</span><small>Platoons</small></button><button class="nav"><span>🏌️</span><small>My Game</small></button></nav>
<script>
const K='golfrecon-platoons-v15-preview';
const roster=['Mike S.','Sully','Chuck','Cunny','Mannke','Steve'];
const defaultState={name:'My Time',motto:"It's Not About The Golf",chief:'Mike S.',coChief:'Not assigned',season:2026,cadets:6,visibility:'Private',wars:[],missions:[{id:'m1',title:'Sunday Funday',date:'2026-09-20',time:'08:10',course:'Windham Country Club',format:'Net stroke play',players:['Mike S.','Sully','Chuck','Cunny'],guests:[],status:'draft',preview:null,results:null}]};
let data=(()=>{try{return {...structuredClone(defaultState),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return structuredClone(defaultState)}})();
const save=()=>localStorage.setItem(K,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'Date TBD';
const fmtTime=v=>{if(!v)return 'TBD';const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};
function dateTile(v){if(!v)return '<div class="date-tile"><div class="day">—</div><div class="dow">TBD</div></div>';const d=new Date(v+'T12:00:00');return `<div class="date-tile"><div class="mon">${d.toLocaleString(undefined,{month:'short'}).toUpperCase()}</div><div class="day">${d.getDate()}</div><div class="dow">${d.toLocaleString(undefined,{weekday:'short'}).toUpperCase()}</div></div>`}
function allMissions(){return [...(data.missions||[]),...(data.wars||[]).flatMap(w=>(w.missions||[]).map(m=>({...m,warId:w.id,warTitle:w.title})))]}
function findMission(id,warId=''){if(warId){const w=(data.wars||[]).find(x=>x.id===warId);return {m:w?.missions?.find(x=>x.id===id),w}}return {m:(data.missions||[]).find(x=>x.id===id),w:null}}
function statusTag(s){return `<span class="tag ${s==='completed'?'complete':s==='ready'?'ready':'draft'}">${s==='completed'?'COMPLETE':s==='ready'?'PREVIEW READY':'DRAFT'}</span>`}
function createPreview(m){const prior=allMissions().filter(x=>x.id!==m.id&&x.course===m.course&&x.results);return {battlefield:prior.length?`${prior.length} prior Platoon round${prior.length===1?'':'s'} at ${m.course}.`:`First Platoon data point at ${m.course}.`,watch:`${(m.players||[])[0]||'The field'} gets the first spotlight. Keep the doubles off the card.`,history:prior.length?`Past results are loaded for matchup and course-history callouts.`:`Today's scores establish the baseline.`}}
function missionPeople(m){return [...(m.players||[]).map(x=>({name:x,guest:false})),...(m.guests||[]).map(x=>({name:x,guest:true}))]}
function missionCard(m,war=null,featured=false){const people=missionPeople(m);return `<div class="mission-card ${featured?'featured':''}"><div class="mission-head">${dateTile(m.date)}<div><div class="mission-title">${esc(m.title||m.course)}</div><div class="mission-course">${esc(m.course||'Course TBD')}</div></div>${statusTag(m.status)}</div><div class="mission-meta-grid"><div class="meta-cell"><span>Tee Time</span><strong>${esc(fmtTime(m.time))}</strong></div><div class="meta-cell"><span>Format</span><strong>${esc(m.format||'TBD')}</strong></div><div class="meta-cell"><span>Field</span><strong>${people.length} players</strong></div></div><div class="players">${people.map(p=>`<span class="player-chip ${p.guest?'guest':''}">${p.guest?'★ ':''}${esc(p.name)}</span>`).join('')}</div>${m.status==='ready'&&m.preview?renderPreview(m.preview):''}${m.status==='completed'&&m.summary?renderSummary(m.summary):''}<div class="mini-actions">${m.status==='draft'?`<button class="button primary" onclick="lockMission('${m.id}','${war?.id||''}')">🔒 Create Preview</button>`:`<button class="button secondary" onclick="viewPreview('${m.id}','${war?.id||''}')">Preview</button>`}${m.status==='completed'?`<button class="button secondary" onclick="viewPost('${m.id}','${war?.id||''}')">Post-Game</button>`:`<button class="button secondary" onclick="openScores('${m.id}','${war?.id||''}')">📸 Scores</button>`}<button class="button secondary" onclick="openMissionEditor('${m.id}','${war?.id||''}')">Edit</button></div></div>`}
function renderPreview(p){return `<div class="preview"><h4>🛰️ Pre-Mission Intel</h4><p><strong>Battlefield:</strong> ${esc(p.battlefield)}</p><p><strong>Watch:</strong> ${esc(p.watch)}</p><p><strong>History:</strong> ${esc(p.history)}</p></div>`}
function renderSummary(s){return `<div class="summary"><h4>🏁 After Action</h4><p>${esc(s)}</p></div>`}
function calcLeaderboard(w){const map={};(w.missions||[]).filter(m=>m.status==='completed').forEach(m=>(m.results||[]).forEach(r=>{map[r.player]=(map[r.player]||0)+Number(r.points||0)}));return Object.entries(map).sort((a,b)=>b[1]-a[1])}
function renderWar(w){const ms=w.missions||[],done=ms.filter(m=>m.status==='completed').length,next=ms.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0],lb=calcLeaderboard(w);return `<section class="card war-card"><div class="war-head"><div><div class="eyebrow">WAR</div><h3>${esc(w.title)}</h3></div><span class="tag war">${done}/${ms.length} MISSIONS</span></div><div class="progress"><span style="width:${ms.length?Math.round(done/ms.length*100):0}%"></span></div>${lb.length?`<table class="leaderboard"><thead><tr><th>Player</th><th>Pts</th></tr></thead><tbody>${lb.map(([p,pts],i)=>`<tr><td>${i+1}. ${esc(p)}</td><td>${pts}</td></tr>`).join('')}</tbody></table>`:''}${next?`<div class="eyebrow" style="margin:12px 0 6px">NEXT WAR MISSION</div>${missionCard(next,w,true)}`:''}<button class="button secondary toggle" onclick="openWar('${w.id}')">War Details</button></section>`}
function render(){const missions=allMissions(),upcoming=missions.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date))),completed=missions.filter(m=>m.status==='completed').sort((a,b)=>String(b.date).localeCompare(String(a.date))),latest=completed[0],older=completed.slice(1),next=upcoming[0];document.getElementById('app').innerHTML=`<div class="section-head"><div><div class="eyebrow">PLATOON HQ</div><h2>${esc(data.name)}</h2></div><div class="actions"><button class="button secondary" onclick="openSetup()">⚙ Setup</button><button class="button primary" onclick="openCreateChooser()">+ Operation</button></div></div><section class="card command"><div class="eyebrow">${esc(data.name.toUpperCase())} · ACTIVE PLATOON</div><div class="title">${esc(data.name)}</div><div class="motto">${esc(data.motto)}</div><div class="admin"><span><strong>Chief</strong> ${esc(data.chief)}</span><span><strong>Co-Chief</strong> ${esc(data.coChief)}</span></div><div class="badges"><span class="badge">${data.season}</span><span class="badge">${data.cadets} cadets</span><span class="badge">${esc(data.visibility)}</span></div><div class="kpis"><div class="kpi"><strong>${next?'1':'—'}</strong><span>Next Up</span></div><div class="kpi"><strong>${missions.length}</strong><span>Missions</span></div><div class="kpi"><strong>${completed.length}</strong><span>Complete</span></div><div class="kpi"><strong>${data.wars?.length||0}</strong><span>Wars</span></div></div></section>${(data.wars||[]).map(renderWar).join('')}${upcoming.length?`<div class="section-head"><div><div class="eyebrow">UPCOMING</div><h2>Missions</h2></div></div><div class="stack">${upcoming.filter(m=>!m.warId).map((m,i)=>missionCard(m,null,i===0)).join('')}</div>`:''}${latest?`<div class="section-head"><div><div class="eyebrow">LATEST RESULT</div><h2>After Action</h2></div></div>${missionCard(latest,latest.warId?(data.wars||[]).find(w=>w.id===latest.warId):null,true)}`:''}${older.length?`<section class="card mission-shell"><div class="eyebrow">MISSION HISTORY</div><div id="historyRows" style="display:none">${older.map(m=>`<div class="archive-row">${dateTile(m.date)}<div><div class="mission-title">${esc(m.title||m.course)}</div><div class="mission-course">${esc(m.course)} · ${esc(fmtTime(m.time))}</div></div><div class="archive-actions"><button class="button secondary" onclick="viewPreview('${m.id}','${m.warId||''}')">Preview</button><button class="button secondary" onclick="viewPost('${m.id}','${m.warId||''}')">Post</button></div></div>`).join('')}</div><button class="button secondary toggle" id="historyToggle" onclick="toggleHistory()">Show ${older.length} older mission${older.length===1?'':'s'}</button></section>`:''}`}
function toggleHistory(){const x=document.getElementById('historyRows'),b=document.getElementById('historyToggle');const open=x.style.display!=='none';x.style.display=open?'none':'block';b.textContent=open?`Show ${x.children.length} older missions`:'Hide history'}
function dlg(html){document.getElementById('d')?.remove();const d=document.createElement('dialog');d.id='d';d.innerHTML=`<div class="dialog">${html}</div>`;document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();return d}
function closeD(){document.getElementById('d')?.close()}
function openSetup(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">PLATOON SETUP</div><h2>${esc(data.name)}</h2></div><button class="x" onclick="closeD()">✕</button></div><label>Name<input id="pn" value="${esc(data.name)}"></label><label>Motto<input id="pm" value="${esc(data.motto)}"></label><div class="dialog-actions"><button class="button primary" id="ps">Save</button></div>`);d.querySelector('#ps').onclick=()=>{data.name=d.querySelector('#pn').value.trim()||data.name;data.motto=d.querySelector('#pm').value.trim();save();closeD();render()}}
function openCreateChooser(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">NEW OPERATION</div><h2>Create</h2></div><button class="x" onclick="closeD()">✕</button></div><div class="dialog-actions" style="justify-content:stretch"><button class="button primary" style="flex:1" onclick="closeD();openMissionEditor()">Mission</button><button class="button secondary" style="flex:1" onclick="closeD();openWarEditor()">War</button></div>`)}
function openMissionEditor(id='',warId=''){const {m,w}=findMission(id,warId),x=m||{players:[],guests:[]};let guests=[...(x.guests||[])];const checks=roster.map(p=>`<label class="check"><input type="checkbox" data-player value="${esc(p)}" ${(x.players||[]).includes(p)?'checked':''}>${esc(p)}</label>`).join('');const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION</div><h2>${m?'Edit':'Create'}</h2></div><button class="x" onclick="closeD()">✕</button></div><div class="form-grid"><label>Date<input id="md" type="date" value="${esc(x.date||'')}"></label><label>Tee time<input id="mt" type="time" value="${esc(x.time||'')}"></label></div><label>Course<input id="mc" value="${esc(x.course||'')}"></label><div class="form-grid"><label>Mission name<input id="mn" value="${esc(x.title||'')}"></label><label>Format<input id="mf" value="${esc(x.format||'')}"></label></div><div class="eyebrow" style="margin-top:13px">PLATOON PLAYERS</div><div class="check-grid">${checks}</div><div class="eyebrow" style="margin-top:13px">GUESTS</div><div class="guest-add"><input id="guestName" placeholder="Guest name"><button class="button secondary" id="addGuest">Add</button></div><div class="guest-list" id="guestList"></div><div class="dialog-actions"><button class="button secondary" onclick="closeD()">Cancel</button><button class="button primary" id="ms">Save Mission</button></div>`);const renderGuests=()=>d.querySelector('#guestList').innerHTML=guests.map((g,i)=>`<span class="guest-pill">★ ${esc(g)} <button data-rg="${i}">✕</button></span>`).join('');renderGuests();d.querySelector('#guestList').onclick=e=>{if(e.target.dataset.rg!==undefined){guests.splice(Number(e.target.dataset.rg),1);renderGuests()}};d.querySelector('#addGuest').onclick=()=>{const n=d.querySelector('#guestName').value.trim();if(n&&!guests.some(g=>g.toLowerCase()===n.toLowerCase()))guests.push(n);d.querySelector('#guestName').value='';renderGuests()};d.querySelector('#ms').onclick=()=>{const row={id:m?.id||'m'+Date.now(),date:d.querySelector('#md').value,time:d.querySelector('#mt').value,course:d.querySelector('#mc').value.trim(),title:d.querySelector('#mn').value.trim(),format:d.querySelector('#mf').value.trim(),players:[...d.querySelectorAll('[data-player]:checked')].map(i=>i.value),guests,status:m?.status||'draft',preview:m?.preview||null,results:m?.results||null,summary:m?.summary||null};if(!row.date||!row.course){alert('Add a date and course.');return}if(w){if(m)Object.assign(m,row);else w.missions.push(row)}else{if(m)Object.assign(m,row);else data.missions.push(row)}save();closeD();render()}}
function openWarEditor(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">WAR</div><h2>Create War</h2></div><button class="x" onclick="closeD()">✕</button></div><label>War name<input id="wn" placeholder="Butter Brook War"></label><label>Location / trip<input id="wl" placeholder="Optional"></label><div class="dialog-actions"><button class="button primary" id="ws">Create</button></div>`);d.querySelector('#ws').onclick=()=>{const title=d.querySelector('#wn').value.trim();if(!title)return;data.wars.push({id:'w'+Date.now(),title,location:d.querySelector('#wl').value.trim(),missions:[]});save();closeD();render()}}
function openWar(id){const w=(data.wars||[]).find(x=>x.id===id);if(!w)return;const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">WAR</div><h2>${esc(w.title)}</h2></div><button class="x" onclick="closeD()">✕</button></div><div class="stack" style="margin-top:12px">${(w.missions||[]).map(m=>missionCard(m,w)).join('')||'<div class="notice">No Missions yet.</div>'}</div><div class="dialog-actions"><button class="button primary" onclick="closeD();openMissionEditor('','${w.id}')">+ Mission</button></div>`)}
function lockMission(id,warId=''){const {m}=findMission(id,warId);if(!m)return;m.preview=createPreview(m);m.status='ready';save();render()}
function viewPreview(id,warId=''){const {m}=findMission(id,warId);if(!m)return;dlg(`<div class="dialog-head"><div><div class="eyebrow">PRE-MISSION INTEL</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="closeD()">✕</button></div>${m.preview?renderPreview(m.preview):'<div class="notice">No Preview generated.</div>'}`)}
function viewPost(id,warId=''){const {m}=findMission(id,warId);if(!m)return;dlg(`<div class="dialog-head"><div><div class="eyebrow">AFTER ACTION</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="closeD()">✕</button></div>${m.summary?renderSummary(m.summary):'<div class="notice">No Post-Game summary yet.</div>'}`)}
function openScores(id,warId=''){const {m}=findMission(id,warId);if(!m)return;const people=missionPeople(m);const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION RESULTS</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="closeD()">✕</button></div><label class="upload"><strong>Add score screenshots</strong><input type="file" accept="image/*" multiple></label><div class="eyebrow" style="margin-top:13px">SELECT PLAYER</div><div class="radio-list">${people.map((p,i)=>`<label class="radio"><input type="radio" name="resultPlayer" value="${esc(p.name)}" ${i===0?'checked':''}>${p.guest?'★ ':''}${esc(p.name)}</label>`).join('')}</div><label>Points for selected player<input id="pts" type="number" value="0"></label><div class="dialog-actions"><button class="button secondary" id="addResult">Add Result</button><button class="button primary" id="finish">Complete Mission</button></div><div id="resultList" class="notice">${(m.results||[]).map(r=>`${esc(r.player)} ${r.points} pts`).join(' · ')||'No results added.'}</div>`);d.querySelector('#addResult').onclick=()=>{const p=d.querySelector('[name=resultPlayer]:checked')?.value;if(!p)return;m.results=m.results||[];const existing=m.results.find(r=>r.player===p);if(existing)existing.points=Number(d.querySelector('#pts').value||0);else m.results.push({player:p,points:Number(d.querySelector('#pts').value||0)});save();d.querySelector('#resultList').innerHTML=m.results.map(r=>`${esc(r.player)} ${r.points} pts`).join(' · ')};d.querySelector('#finish').onclick=()=>{m.status='completed';const sorted=[...(m.results||[])].sort((a,b)=>b.points-a.points);m.summary=sorted.length?`${sorted[0].player} led the Mission with ${sorted[0].points} points. Full hole-by-hole After Action analysis will populate when screenshot parsing is connected.`:'Mission complete. Score analysis pending.';save();closeD();render()}}
render();
</script></body></html>
