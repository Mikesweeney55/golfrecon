<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Recon v15 Platoons</title>
<style>
:root{--bg:#0d1412;--panel:#15201c;--panel2:#1d2b26;--line:#2a3a34;--text:#f5f7f6;--muted:#9eb0a8;--accent:#b8ea68;--accent2:#83c94f;--warning:#ffd400;--blue:#7edbff;--gold:#ffcf68;--good:#7ee39b;--shadow:0 14px 32px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3228 0,#0d1412 38%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding:16px 14px 100px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:18px}.brand{text-align:center;font-size:26px;font-weight:950;letter-spacing:.12em}.version{font-size:11px;color:var(--muted);justify-self:end}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:900}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 10px}.section-head h2{margin:2px 0 0;font-size:22px}.actions,.mini-actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:0;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:#14200f}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.card{background:rgba(21,32,28,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.command{background:radial-gradient(circle at 88% 0,rgba(56,201,255,.08),transparent 36%),linear-gradient(145deg,rgba(13,31,22,.98),rgba(7,19,14,.98))}.title{font-size:29px;line-height:1;margin:6px 0}.motto{font-weight:800;color:#dbe8e1}.admin{font-size:10px;color:var(--muted);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}.admin strong{color:#eaf2ee}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#24352e;color:#dce8e2;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.kpi{background:#101914;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.kpi strong{display:block;font-size:21px}.kpi span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.row h3{margin:3px 0 4px;font-size:20px}.muted{color:var(--muted)}.small{font-size:11px}.ready{color:var(--accent);border:1px solid rgba(184,234,104,.3);background:rgba(184,234,104,.07)}.complete{color:var(--good);border:1px solid rgba(126,227,155,.3);background:rgba(126,227,155,.07)}.draft{color:#f2d335;border:1px solid rgba(242,211,53,.3);background:rgba(242,211,53,.08)}.war{color:var(--gold);border:1px solid rgba(255,207,104,.35);background:rgba(255,207,104,.08)}.mission-stack{display:grid;gap:12px;margin-top:14px}.mission-item{border:1px solid var(--line);background:#101914;border-radius:14px;padding:13px}.mission-focus{border-color:rgba(184,234,104,.35);box-shadow:0 0 0 1px rgba(184,234,104,.08) inset}.preview,.postgame{margin-top:12px;padding:12px;background:#0e1814;border-radius:13px}.preview{border-left:3px solid var(--accent)}.postgame{border-left:3px solid var(--good)}.preview h4,.postgame h4{margin:0 0 6px}.preview p,.postgame p{font-size:12px;color:#dce6e1;margin:0 0 8px}.history-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}.history-row:last-child{border-bottom:0}.history-main strong{display:block}.history-main span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.archive-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.archive-actions .button,.mini-actions .button{padding:8px 10px;font-size:10px}.progress{height:8px;background:#0c1512;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.leaderboard{width:100%;border-collapse:collapse;margin-top:10px}.leaderboard th,.leaderboard td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.leaderboard th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.leaderboard td:nth-child(n+2),.leaderboard th:nth-child(n+2){text-align:right}.player-picks{display:grid;gap:7px;margin-top:10px}.player-pick{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#101914;border-radius:11px;padding:10px}.player-pick input{width:auto;margin:0}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.96);backdrop-filter:blur(14px);border:1px solid rgba(207,232,219,.42);border-radius:20px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.32)}.nav{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:13px}.nav span{display:block;font-size:18px}.nav small{font-size:11px}.nav.active{background:#24342e;color:var(--text)}dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(640px,calc(100% - 24px))}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog{max-height:calc(100dvh - 28px);overflow:auto;background:#16221d;border:1px solid var(--line);border-radius:22px;padding:20px}.dialog-head{display:flex;justify-content:space-between;gap:10px}.dialog-head h2{margin:3px 0}.x{border:0;background:transparent;color:var(--text);font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;margin-top:11px;font-weight:750;font-size:12px}input,select,textarea{width:100%;background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}textarea{min-height:72px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.choice{border:1px solid var(--line);background:#101914;color:var(--text);border-radius:14px;padding:16px;text-align:left}.choice strong{display:block;font-size:17px}.choice span{display:block;font-size:10px;color:var(--muted);margin-top:4px}@media(max-width:700px){.brand{font-size:22px}.kpis{grid-template-columns:repeat(2,1fr)}.form-grid,.choice-grid{grid-template-columns:1fr}.row{flex-direction:column}.history-row{align-items:flex-start}.archive-actions{justify-content:flex-start}}
</style>
</head>
<body><div class="app"><div class="top"><div></div><div class="brand">GOLF RECON</div><div class="version">v15.1 Preview</div></div><main id="app"></main></div>
<nav class="bottom-nav"><button class="nav"><span>⛳</span><small>Pregame</small></button><button class="nav"><span>📊</span><small>Rounds</small></button><button class="nav active"><span>👥</span><small>Platoons</small></button><button class="nav"><span>🏌️</span><small>My Game</small></button></nav>
<script>
const K='golfrecon-platoons-v15-preview';
const defaultState={name:'My Time',motto:"It's Not About The Golf",chief:'Mike S.',coChief:'Not assigned',season:2026,visibility:'Private',roster:['Mike S.','Sully','Chuck','Cunny','Mannke','Steve'],wars:[],missions:[
{id:'m1',title:'Sunday Funday',date:'2026-09-20',course:'Windham Country Club',format:'Net stroke play',players:['Mike S.','Sully','Chuck','Cunny'],status:'ready',preview:{battlefield:'Windham Country Club is familiar ground. Past rounds suggest the opening six are where the field separates.',watch:'Mike and Sully have the best recent form here. Chuck is the volatility play.',history:'The Platoon has enough history here to flag Nos. 5, 11 and 14 as danger holes.'},results:null},
{id:'m0',title:'Friday Fight Club',date:'2026-09-05',course:"Campbell's Scottish Highlands",format:'Individual stroke',players:['Mike S.','Steve','Cunny','Sully'],status:'completed',preview:{battlefield:'Campbell’s rewards patience early and punishes doubles late.',watch:'Mike entered with the strongest course history.',history:'Past trips showed the back nine usually decides the day.'},results:[{player:'Mike S.',gross:78,points:10},{player:'Steve',gross:90,points:6},{player:'Cunny',gross:91,points:4},{player:'Sully',gross:97,points:2}],postgame:'Mike controlled the day with a 78. Cunny created the most birdie pressure, while Sully closed with a birdie on 18.'}
]};
let data=(()=>{try{const saved=JSON.parse(localStorage.getItem(K)||'{}');return {...defaultState,...saved,roster:saved.roster||defaultState.roster}}catch{return structuredClone(defaultState)}})();
const save=()=>localStorage.setItem(K,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'Date TBD';
function allMissions(){return [...(data.missions||[]),...(data.wars||[]).flatMap(w=>(w.missions||[]).map(m=>({...m,warId:w.id,warTitle:w.title})))]}
function getMission(id,warId=''){if(warId){const w=(data.wars||[]).find(x=>x.id===warId);return (w?.missions||[]).find(x=>x.id===id)}return (data.missions||[]).find(x=>x.id===id)}
function createPreview(m){const prior=allMissions().filter(x=>x.id!==m.id&&x.course===m.course&&x.results);return {battlefield:`${m.course}: ${prior.length?`${prior.length} prior Platoon round${prior.length===1?'':'s'} loaded.`:'no Platoon history yet.'}`,watch:`${m.players?.[0]||'The field'} gets the first spotlight. Watch who avoids doubles and owns the closing stretch.`,history:prior.length?`Past results at ${m.course} will drive matchup and danger-hole callouts.`:`This Mission will establish the first Platoon baseline at ${m.course}.`}}
function statusTag(s){return `<span class="tag ${s==='completed'?'complete':s==='ready'?'ready':'draft'}">${s==='completed'?'COMPLETE':s==='ready'?'PREVIEW READY':'DRAFT'}</span>`}
function renderPreview(m){return m.preview?`<div class="preview"><h4>🛰️ Pre-Mission Intel</h4><p><strong>The Battlefield:</strong> ${esc(m.preview.battlefield)}</p><p><strong>Watch These Guys:</strong> ${esc(m.preview.watch)}</p><p><strong>History Lesson:</strong> ${esc(m.preview.history)}</p></div>`:''}
function renderPostgame(m){if(m.status!=='completed')return '';const text=m.postgame||buildPostgame(m);return `<div class="postgame"><h4>🏁 After Action Report</h4><p>${esc(text)}</p></div>`}
function buildPostgame(m){const rows=m.results||[];if(!rows.length)return 'Mission complete. Detailed score analysis will appear here once hole-by-hole scores are loaded.';const best=[...rows].sort((a,b)=>(a.gross??999)-(b.gross??999))[0];return `${best.player} led the Mission with ${best.gross}. Full hole-by-hole highlights, trouble spots and player callouts will appear here from the uploaded score screenshots.`}
function render(){const missions=allMissions();const completed=missions.filter(m=>m.status==='completed');const upcoming=missions.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date)));const latest=[...completed].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];const history=[...completed].sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(m=>m.id!==latest?.id);document.getElementById('app').innerHTML=`
<div class="section-head"><div><div class="eyebrow">PLATOON HQ</div><h2>${esc(data.name)}</h2></div><div class="actions"><button class="button secondary" onclick="openSetup()">⚙ Setup</button><button class="button primary" onclick="openCreateChooser()">+ Operation</button></div></div>
<section class="card command"><div class="eyebrow">${esc(data.name.toUpperCase())} · ACTIVE PLATOON</div><div class="title">${esc(data.name)}</div><div class="motto">${esc(data.motto)}</div><div class="admin"><span><strong>Platoon Chief</strong> ${esc(data.chief)}</span><span><strong>Co-Chief</strong> ${esc(data.coChief)}</span></div><div class="badges"><span class="badge">${data.season} season</span><span class="badge">${data.roster.length} cadets</span><span class="badge">${esc(data.visibility)}</span></div><div class="kpis"><div class="kpi"><strong>${upcoming.length}</strong><span>Upcoming</span></div><div class="kpi"><strong>${missions.length}</strong><span>Missions</span></div><div class="kpi"><strong>${completed.length}</strong><span>Rounds Logged</span></div><div class="kpi"><strong>${data.wars?.length||0}</strong><span>Wars</span></div></div></section>
${(data.wars||[]).map(renderWar).join('')}
<section class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">UPCOMING</div><h3>Next Missions</h3><div class="muted small">Open Missions stay visible with their Preview.</div></div><button class="button primary" onclick="openMissionEditor()">+ Mission</button></div><div class="mission-stack">${upcoming.filter(m=>!m.warId).length?upcoming.filter(m=>!m.warId).map(m=>renderMissionFocus(m)).join(''):'<div class="muted small">No stand-alone upcoming Missions.</div>'}</div></section>
${latest?`<section class="card" style="margin-top:14px"><div class="eyebrow">LATEST RESULT</div><h3 style="margin:4px 0 0">Most Recent Mission</h3>${renderMissionFocus(latest,true)}</section>`:''}
<section class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">MISSION HISTORY</div><h3>Past Missions</h3><div class="muted small">Older Missions stay compact. Open either side of the story anytime.</div></div></div><div id="historyList" class="${history.length?'':'muted small'}">${history.length?history.map(renderHistoryRow).join(''):'No older Missions yet.'}</div></section>`}
function renderMissionFocus(m,latest=false){const war=m.warId?{id:m.warId}:null;return `<div class="mission-item mission-focus" style="margin-top:12px"><div class="row"><div><div class="eyebrow">${m.warId?'WAR MISSION':'MISSION'}${latest?' · LATEST':''}</div><strong>${esc(m.title||m.course)}</strong><div class="muted small">${esc(fmtDate(m.date))} · ${esc(m.course)}${m.format?' · '+esc(m.format):''}</div></div>${statusTag(m.status)}</div>${renderPreview(m)}${renderPostgame(m)}<div class="mini-actions">${m.status==='draft'?`<button class="button primary" onclick="lockMission('${m.id}','${m.warId||''}')">🔒 Lock & Create Preview</button>`:`<button class="button secondary" onclick="viewPreview('${m.id}','${m.warId||''}')">View Preview</button>`}${m.status==='completed'?`<button class="button secondary" onclick="viewPostgame('${m.id}','${m.warId||''}')">View Post-Game</button>`:`<button class="button secondary" onclick="openScores('${m.id}','${m.warId||''}')">📸 Upload Scores</button>`}<button class="button secondary" onclick="openMissionEditor('${m.id}','${m.warId||''}')">Edit</button></div></div>`}
function renderHistoryRow(m){return `<div class="history-row"><div class="history-main"><strong>${esc(m.title||m.course)}</strong><span>${esc(fmtDate(m.date))} · ${esc(m.course)}${m.warTitle?' · '+esc(m.warTitle):''}</span></div><div class="archive-actions"><button class="button secondary" onclick="viewPreview('${m.id}','${m.warId||''}')">Preview</button><button class="button secondary" onclick="viewPostgame('${m.id}','${m.warId||''}')">Post-Game</button></div></div>`}
function renderWar(w){const ms=w.missions||[],done=ms.filter(m=>m.status==='completed').length;const lb=calcLeaderboard(w);const next=ms.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];return `<section class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">ACTIVE WAR</div><h3>${esc(w.title)}</h3><div class="muted small">${done} of ${ms.length} Missions complete</div></div><span class="tag war">WAR</span></div><div class="progress"><span style="width:${ms.length?Math.round(done/ms.length*100):0}%"></span></div>${lb.length?`<table class="leaderboard"><thead><tr><th>Player</th><th>Pts</th><th>Missions</th></tr></thead><tbody>${lb.map(r=>`<tr><td>${esc(r.player)}</td><td>${r.points}</td><td>${r.missions}</td></tr>`).join('')}</tbody></table>`:'<div class="muted small">Leaderboard activates after the first completed Mission.</div>'}${next?`<div style="margin-top:12px"><div class="eyebrow">NEXT WAR MISSION</div>${renderMissionFocus({...next,warId:w.id})}</div>`:''}<div class="mini-actions"><button class="button secondary" onclick="openMissionEditor('','${w.id}')">+ Add Mission</button></div></section>`}
function calcLeaderboard(w){const map={};(w.missions||[]).filter(m=>m.status==='completed').forEach(m=>(m.results||[]).forEach(r=>{map[r.player]??={player:r.player,points:0,missions:0};map[r.player].points+=Number(r.points||0);map[r.player].missions++}));return Object.values(map).sort((a,b)=>b.points-a.points)}
function dlg(html){const d=document.createElement('dialog');d.innerHTML=`<div class="dialog">${html}</div>`;document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();return d}
function openCreateChooser(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">NEW OPERATION</div><h2>Create</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="choice-grid"><button class="choice" onclick="this.closest('dialog').close();openMissionEditor()"><strong>Mission</strong><span>One competitive golf round.</span></button><button class="choice" onclick="this.closest('dialog').close();openWarEditor()"><strong>War</strong><span>Multiple Missions with a live cumulative leaderboard.</span></button></div>`)}
function openSetup(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">PLATOON SETUP</div><h2>${esc(data.name)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><label>Platoon name<input id="pn" value="${esc(data.name)}"></label><label>Motto<input id="pm" value="${esc(data.motto)}"></label><label>Roster (comma separated)<textarea id="pr">${esc(data.roster.join(', '))}</textarea></label><div class="dialog-actions"><button class="button primary" id="saveSetup">Save</button></div>`);d.querySelector('#saveSetup').onclick=()=>{data.name=d.querySelector('#pn').value.trim()||'My Time';data.motto=d.querySelector('#pm').value.trim();data.roster=d.querySelector('#pr').value.split(',').map(x=>x.trim()).filter(Boolean);save();d.close();render()}}
function openWarEditor(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">WAR SETUP</div><h2>Create War</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><label>War name<input id="wt" placeholder="Butter Brook War"></label><div class="dialog-actions"><button class="button primary" id="saveWar">Create War</button></div>`);d.querySelector('#saveWar').onclick=()=>{const t=d.querySelector('#wt').value.trim();if(!t)return;data.wars.push({id:'w'+Date.now(),title:t,missions:[]});save();d.close();render()}}
function openMissionEditor(id='',warId=''){const m=id?getMission(id,warId):null;const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION SETUP</div><h2>${m?'Edit Mission':'Create Mission'}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="form-grid"><label>Date<input id="md" type="date" value="${esc(m?.date||'')}"></label><label>Course<input id="mc" value="${esc(m?.course||'')}"></label></div><div class="form-grid"><label>Title<input id="mt" value="${esc(m?.title||'')}"></label><label>Format<input id="mf" value="${esc(m?.format||'')}"></label></div><label>Players in this Mission</label><div class="player-picks">${data.roster.map(p=>`<label class="player-pick"><input type="checkbox" data-player value="${esc(p)}" ${(m?.players||[]).includes(p)?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div><div class="dialog-actions"><button class="button primary" id="saveMission">Save Mission</button></div>`);d.querySelector('#saveMission').onclick=()=>{const row={id:m?.id||'m'+Date.now(),date:d.querySelector('#md').value,course:d.querySelector('#mc').value.trim(),title:d.querySelector('#mt').value.trim(),format:d.querySelector('#mf').value.trim(),players:[...d.querySelectorAll('[data-player]:checked')].map(x=>x.value),status:m?.status||'draft',preview:m?.preview||null,results:m?.results||null,postgame:m?.postgame||''};if(!row.date||!row.course)return alert('Choose a date and course.');if(m)Object.assign(m,row);else if(warId){const w=data.wars.find(x=>x.id===warId);w.missions.push(row)}else data.missions.push(row);save();d.close();render()}}
function lockMission(id,warId=''){const m=getMission(id,warId);m.preview=createPreview(m);m.status='ready';save();render()}
function viewPreview(id,warId=''){const m=getMission(id,warId);dlg(`<div class="dialog-head"><div><div class="eyebrow">PRE-MISSION PREVIEW</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div>${renderPreview(m)}`)}
function viewPostgame(id,warId=''){const m=getMission(id,warId);dlg(`<div class="dialog-head"><div><div class="eyebrow">AFTER ACTION REPORT</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div>${renderPostgame(m)}`)}
function openScores(id,warId=''){const m=getMission(id,warId);const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION RESULTS</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="muted small" style="margin-top:8px">Prototype result entry. Choose one Platoon member at a time. The production version will populate hole-by-hole scores from screenshots.</div><label>Player</label><div class="player-picks">${data.roster.map((p,i)=>`<label class="player-pick"><input type="radio" name="resultPlayer" value="${esc(p)}" ${i===0?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div><div class="form-grid"><label>Gross<input id="gross" type="number"></label><label>War points<input id="pts" type="number" value="0"></label></div><div class="dialog-actions"><button class="button primary" id="addResult">Add Player Result</button><button class="button secondary" id="finishMission">Complete Mission</button></div><div id="loaded" class="muted small" style="margin-top:12px">${(m.results||[]).length?`${m.results.length} player result(s) loaded.`:'No results loaded yet.'}</div>`);d.querySelector('#addResult').onclick=()=>{const p=d.querySelector('input[name=resultPlayer]:checked')?.value;if(!p)return;const row={player:p,gross:Number(d.querySelector('#gross').value)||null,points:Number(d.querySelector('#pts').value)||0};m.results=m.results||[];const idx=m.results.findIndex(x=>x.player===p);if(idx>=0)m.results[idx]=row;else m.results.push(row);save();d.querySelector('#loaded').textContent=`${m.results.length} player result(s) loaded.`};d.querySelector('#finishMission').onclick=()=>{m.status='completed';m.postgame=buildPostgame(m);save();d.close();render()}}
render();
</script>
</body>
</html>
