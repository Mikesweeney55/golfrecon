<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Recon v15 Platoons</title>
<style>
:root{--bg:#0d1412;--panel:#15201c;--panel2:#1d2b26;--line:#2a3a34;--text:#f5f7f6;--muted:#9eb0a8;--accent:#b8ea68;--accent2:#83c94f;--warning:#ffd400;--danger:#ff4d4f;--blue:#7edbff;--shadow:0 14px 32px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3228 0,#0d1412 38%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:920px;margin:auto;min-height:100vh;padding:16px 14px 100px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:18px}.brand{text-align:center;font-size:28px;font-weight:950;letter-spacing:.12em}.version{font-size:11px;color:var(--muted);justify-self:end}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:900}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 10px}.section-head h2{margin:2px 0 0;font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:0;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:#14200f}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.card{background:rgba(21,32,28,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.command{background:radial-gradient(circle at 88% 0,rgba(56,201,255,.08),transparent 36%),linear-gradient(145deg,rgba(13,31,22,.98),rgba(7,19,14,.98))}.title{font-size:29px;line-height:1;margin:6px 0}.motto{font-weight:800;color:#dbe8e1}.admin{font-size:10px;color:var(--muted);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}.admin strong{color:#eaf2ee}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#24352e;color:#dce8e2;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.kpi{background:#101914;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.kpi strong{display:block;font-size:21px}.kpi span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.mission-card,.war-card{margin-top:14px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.row h3{margin:3px 0 4px;font-size:20px}.muted{color:var(--muted)}.small{font-size:11px}.war{color:#ffcf68;border:1px solid rgba(255,207,104,.35);background:rgba(255,207,104,.08)}.mission{color:var(--blue);border:1px solid rgba(126,219,255,.28);background:rgba(126,219,255,.08)}.draft{color:#f2d335;border:1px solid rgba(242,211,53,.3);background:rgba(242,211,53,.08)}.ready{color:var(--accent);border:1px solid rgba(184,234,104,.3);background:rgba(184,234,104,.07)}.complete{color:#7ee39b;border:1px solid rgba(126,227,155,.3);background:rgba(126,227,155,.07)}.progress{height:8px;background:#0c1512;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:50%}.mission-list{display:grid;gap:8px;margin-top:12px}.mission-item{border:1px solid var(--line);background:#101914;border-radius:14px;padding:11px}.mission-item .row{align-items:center}.mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini-actions .button{padding:8px 10px;font-size:10px}.leaderboard{width:100%;border-collapse:collapse;margin-top:10px}.leaderboard th,.leaderboard td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.leaderboard th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.leaderboard td:nth-child(n+2),.leaderboard th:nth-child(n+2){text-align:right}.move-up{color:#69df8b}.move-down{color:#ff8f8f}.preview{margin-top:12px;border-left:3px solid var(--accent);padding:12px 12px 2px;background:#101914;border-radius:0 13px 13px 0}.preview h4{margin:0 0 5px}.preview p{font-size:12px;color:#dce6e1;margin:0 0 10px}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.96);backdrop-filter:blur(14px);border:1px solid rgba(207,232,219,.42);border-radius:20px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.32)}.nav{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:13px}.nav span{display:block;font-size:18px}.nav small{font-size:11px}.nav.active{background:#24342e;color:var(--text)}dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(640px,calc(100% - 24px))}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog{max-height:calc(100dvh - 28px);overflow:auto;background:#16221d;border:1px solid var(--line);border-radius:22px;padding:20px}.dialog-head{display:flex;justify-content:space-between;gap:10px}.dialog-head h2{margin:3px 0}.x{border:0;background:transparent;color:var(--text);font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;margin-top:11px;font-weight:750;font-size:12px}input,select,textarea{width:100%;background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}textarea{min-height:72px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.choice{border:1px solid var(--line);background:#101914;color:var(--text);border-radius:14px;padding:16px;text-align:left}.choice strong{display:block;font-size:17px}.choice span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{font-size:10px;color:var(--muted);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#101914;margin-top:10px}.score-grid{overflow:auto;margin-top:10px}.score-grid table{border-collapse:collapse;min-width:760px;width:100%;font-size:10px}.score-grid th,.score-grid td{padding:5px;border:1px solid var(--line);text-align:center}.score-grid th:first-child,.score-grid td:first-child{text-align:left;position:sticky;left:0;background:#101914}.upload{border:1px dashed #52685d;border-radius:16px;padding:20px;text-align:center;background:#101914;margin-top:14px}.upload input{display:none}.hidden{display:none}@media(max-width:700px){.brand{font-size:22px}.kpis{grid-template-columns:repeat(2,1fr)}.form-grid,.choice-grid{grid-template-columns:1fr}.row{flex-direction:column}.row .actions{width:100%}.section-head{align-items:flex-start}.section-head .actions{justify-content:flex-end}.app{padding-left:12px;padding-right:12px}}
</style>
</head>
<body><div class="app"><div class="top"><div></div><div class="brand">GOLF RECON</div><div class="version">v15.0 Preview</div></div><main id="app"></main></div>
<nav class="bottom-nav"><button class="nav"><span>⛳</span><small>Pregame</small></button><button class="nav"><span>📊</span><small>Rounds</small></button><button class="nav active"><span>👥</span><small>Platoons</small></button><button class="nav"><span>🏌️</span><small>My Game</small></button></nav>
<script>
const K='golfrecon-platoons-v15-preview';
const defaultState={name:'My Time',motto:"It's Not About The Golf",chief:'Mike S.',coChief:'Not assigned',season:2026,cadets:6,visibility:'Private',wars:[],missions:[{id:'m1',title:'Sunday Funday',date:'2026-09-20',course:'Windham Country Club',format:'Net stroke play',players:['Mike S.','Sully','Chuck','Cunny'],status:'draft',preview:null,results:null}]};
let data=(()=>{try{return {...defaultState,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return structuredClone(defaultState)}})();
const save=()=>localStorage.setItem(K,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'Date TBD';
function allMissions(){return [...(data.missions||[]),...(data.wars||[]).flatMap(w=>(w.missions||[]).map(m=>({...m,warId:w.id,warTitle:w.title})))]}
function createPreview(m){const prior=allMissions().filter(x=>x.id!==m.id&&x.course===m.course&&x.results);const history=prior.length?`${prior.length} prior Platoon round${prior.length===1?'':'s'} here are in the books.`:'No Platoon history here yet — this one starts the book.';return {generated:new Date().toISOString(),battlefield:`${m.course}: ${history}`,watch:`Watch the opening stretch and keep doubles off the card. ${m.players?.[0]||'The field'} gets the first spotlight.`,history:prior.length?`Previous rounds at ${m.course} are loaded and will drive player-versus-player callouts.`:`First Mission at ${m.course}. Today's scores will establish the course baseline.`,targets:(m.players||[]).map((p,i)=>`${p} — ${i===0?'set the pace':'beat your own baseline and pressure the leaders'}.`).join(' ')}}
function statusTag(s){return `<span class="tag ${s==='completed'?'complete':s==='ready'?'ready':'draft'}">${s==='completed'?'COMPLETE':s==='ready'?'PREVIEW READY':'DRAFT'}</span>`}
function render(){const missions=allMissions();const completed=missions.filter(m=>m.status==='completed').length;const next=missions.filter(m=>m.status!=='completed').sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];document.getElementById('app').innerHTML=`
<div class="section-head"><div><div class="eyebrow">PLATOON HQ</div><h2>${esc(data.name)}</h2></div><div class="actions"><button class="button secondary" onclick="openSetup()">⚙ Setup</button><button class="button primary" onclick="openCreateChooser()">+ Operation</button></div></div>
<section class="card command"><div class="eyebrow">${esc(data.name.toUpperCase())} · ACTIVE PLATOON</div><div class="title">${esc(data.name)}</div><div class="motto">${esc(data.motto)}</div><div class="admin"><span><strong>Platoon Chief</strong> ${esc(data.chief)}</span><span><strong>Co-Chief</strong> ${esc(data.coChief)}</span></div><div class="badges"><span class="badge">${data.season} season</span><span class="badge">${data.cadets} cadets</span><span class="badge">${esc(data.visibility)}</span></div><div class="kpis"><div class="kpi"><strong>${next?esc(next.warId?'WAR':'MISSION'):'—'}</strong><span>Next Operation</span></div><div class="kpi"><strong>${missions.length}</strong><span>Missions</span></div><div class="kpi"><strong>${completed}</strong><span>Rounds Logged</span></div><div class="kpi"><strong>${data.wars?.length||0}</strong><span>Wars</span></div></div></section>
${(data.wars||[]).map(renderWar).join('')}
<section class="card mission-card"><div class="row"><div><div class="eyebrow">STAND-ALONE MISSIONS</div><h3>Mission Control</h3><div class="muted small">One round. Lock it, build the Preview, play it, then upload hole-by-hole scores.</div></div><button class="button primary" onclick="openMissionEditor()">+ Mission</button></div><div class="mission-list">${(data.missions||[]).length?(data.missions||[]).map(m=>renderMission(m)).join(''):'<div class="muted small">No stand-alone Missions yet.</div>'}</div></section>`}
function renderMission(m,war){return `<div class="mission-item"><div class="row"><div><div class="eyebrow">${war?'WAR MISSION':'MISSION'}</div><strong>${esc(m.title||m.course)}</strong><div class="muted small">${esc(fmtDate(m.date))} · ${esc(m.course)}${m.format?' · '+esc(m.format):''}</div></div>${statusTag(m.status)}</div>${m.preview?`<div class="preview"><h4>🛰️ Pre-Mission Intel</h4><p><strong>The Battlefield:</strong> ${esc(m.preview.battlefield)}</p><p><strong>Watch These Guys:</strong> ${esc(m.preview.watch)}</p><p><strong>History Lesson:</strong> ${esc(m.preview.history)}</p></div>`:''}<div class="mini-actions">${m.status==='draft'?`<button class="button primary" onclick="lockMission('${m.id}','${war?.id||''}')">🔒 Lock & Create Preview</button>`:`<button class="button secondary" onclick="viewPreview('${m.id}','${war?.id||''}')">View Preview</button>`}<button class="button secondary" onclick="openMissionEditor('${m.id}','${war?.id||''}')">Edit</button><button class="button secondary" onclick="openScores('${m.id}','${war?.id||''}')">📸 Upload Scores</button></div></div>`}
function renderWar(w){const ms=w.missions||[],done=ms.filter(m=>m.status==='completed').length;const leaderboard=calcLeaderboard(w);return `<section class="card war-card"><div class="row"><div><div class="eyebrow">WAR</div><h3>${esc(w.title)}</h3><div class="muted small">${esc(w.location||'Multi-course operation')} · ${done} of ${ms.length} Missions complete</div></div><span class="tag war">WAR IN PROGRESS</span></div><div class="progress"><span style="width:${ms.length?Math.round(done/ms.length*100):0}%"></span></div><div class="eyebrow">LIVE WAR LEADERBOARD</div>${leaderboard.length?`<table class="leaderboard"><thead><tr><th>Player</th><th>Missions</th><th>Pts</th><th>Move</th></tr></thead><tbody>${leaderboard.map((x,i)=>`<tr><td>${i+1}. ${esc(x.name)}</td><td>${x.played}</td><td><strong>${x.points}</strong></td><td class="${x.move>0?'move-up':x.move<0?'move-down':''}">${x.move>0?'▲ '+x.move:x.move<0?'▼ '+Math.abs(x.move):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="notice">Leaderboard activates as Mission results are completed.</div>'}<div class="mission-list">${ms.map(m=>renderMission(m,w)).join('')}</div><div class="mini-actions"><button class="button primary" onclick="openMissionEditor('','${w.id}')">+ Add Mission</button><button class="button secondary" onclick="lockWar('${w.id}')">🔒 Lock War & Create Preview</button></div>${w.preview?`<div class="preview"><h4>⚔️ War Preview</h4><p>${esc(w.preview)}</p></div>`:''}</section>`}
function calcLeaderboard(w){const map={};(w.missions||[]).filter(m=>m.status==='completed'&&m.results).forEach(m=>(m.results||[]).forEach(r=>{const x=map[r.name]||(map[r.name]={name:r.name,points:0,played:0,move:0});x.points+=Number(r.points||0);x.played++}));return Object.values(map).sort((a,b)=>b.points-a.points)}
function dlg(html){const d=document.createElement('dialog');d.innerHTML=`<div class="dialog">${html}</div>`;document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();return d}
function openCreateChooser(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">CREATE OPERATION</div><h2>Mission or War?</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="choice-grid"><button class="choice" id="missionChoice"><strong>⛳ Mission</strong><span>One competitive round at one course.</span></button><button class="choice" id="warChoice"><strong>⚔️ War</strong><span>Multiple Missions, multiple rounds and courses, one live leaderboard.</span></button></div>`);d.querySelector('#missionChoice').onclick=()=>{d.close();openMissionEditor()};d.querySelector('#warChoice').onclick=()=>{d.close();openWarEditor()}}
function openSetup(){const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">PLATOON SETUP</div><h2>${esc(data.name)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="form-grid"><label>Platoon name<input id="pn" value="${esc(data.name)}"></label><label>Season<input id="ps" type="number" value="${data.season}"></label></div><label>Motto<input id="pm" value="${esc(data.motto)}"></label><div class="form-grid"><label>Platoon Chief<input id="pc" value="${esc(data.chief)}"></label><label>Co-Chief<input id="pco" value="${esc(data.coChief)}"></label></div><div class="dialog-actions"><button class="button secondary" onclick="this.closest('dialog').close()">Cancel</button><button class="button primary" id="save">Save</button></div>`);d.querySelector('#save').onclick=()=>{data.name=d.querySelector('#pn').value.trim()||'My Time';data.season=Number(d.querySelector('#ps').value)||2026;data.motto=d.querySelector('#pm').value.trim();data.chief=d.querySelector('#pc').value.trim();data.coChief=d.querySelector('#pco').value.trim()||'Not assigned';save();d.close();render()}}
function openWarEditor(id){const w=(data.wars||[]).find(x=>x.id===id)||{};const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">WAR SETUP</div><h2>${id?'Edit War':'Create War'}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><label>War name<input id="wt" value="${esc(w.title||'')}" placeholder="Butter Brook War 2027"></label><div class="form-grid"><label>Start date<input id="ws" type="date" value="${esc(w.start||'')}"></label><label>End date<input id="we" type="date" value="${esc(w.end||'')}"></label></div><label>Scoring system<select id="wf"><option>Points</option><option>Cumulative net</option><option>Match-play points</option><option>Team points</option></select></label><label>War notes<textarea id="wn">${esc(w.notes||'')}</textarea></label><div class="notice">Each Mission inside a War keeps its own course, date, players, handicap setup, format and results. The War leaderboard recalculates after every completed Mission.</div><div class="dialog-actions"><button class="button secondary" onclick="this.closest('dialog').close()">Cancel</button><button class="button primary" id="save">Save War</button></div>`);d.querySelector('#save').onclick=()=>{if(!d.querySelector('#wt').value.trim())return alert('Name the War.');if(id){Object.assign(w,{title:d.querySelector('#wt').value.trim(),start:d.querySelector('#ws').value,end:d.querySelector('#we').value,scoring:d.querySelector('#wf').value,notes:d.querySelector('#wn').value})}else{data.wars.push({id:'w'+Date.now(),title:d.querySelector('#wt').value.trim(),start:d.querySelector('#ws').value,end:d.querySelector('#we').value,scoring:d.querySelector('#wf').value,notes:d.querySelector('#wn').value,missions:[],preview:null})}save();d.close();render()}}
function missionRef(mid,wid){if(wid){const w=data.wars.find(x=>x.id===wid);return {m:w?.missions?.find(x=>x.id===mid),w}}return {m:data.missions.find(x=>x.id===mid),w:null}}
function openMissionEditor(mid='',wid=''){const ref=mid?missionRef(mid,wid):{m:null,w:wid?data.wars.find(x=>x.id===wid):null},m=ref.m||{};const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION SETUP</div><h2>${mid?'Edit':'Create'} Mission</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div>${ref.w?`<div class="notice">Part of War: <strong>${esc(ref.w.title)}</strong></div>`:''}<div class="form-grid"><label>Date<input id="md" type="date" value="${esc(m.date||'')}"></label><label>Tee time<input id="mt" type="time" value="${esc(m.teeTime||'')}"></label></div><label>Course<input id="mc" value="${esc(m.course||'')}" placeholder="Campbell's Scottish Highlands"></label><label>Mission title<input id="mn" value="${esc(m.title||'')}" placeholder="Optional"></label><label>Format<input id="mf" value="${esc(m.format||'')}" placeholder="Net stroke play, skins, teams..."></label><label>Players<input id="mp" value="${esc((m.players||[]).join(', '))}" placeholder="Mike S., Sully, Chuck, Cunny"></label><label>Rules / notes<textarea id="mnotes">${esc(m.notes||'')}</textarea></label><div class="notice">Mission stays in DRAFT until you deliberately lock it and create the Preview.</div><div class="dialog-actions"><button class="button secondary" onclick="this.closest('dialog').close()">Cancel</button><button class="button primary" id="save">Save Draft</button></div>`);d.querySelector('#save').onclick=()=>{if(!d.querySelector('#md').value||!d.querySelector('#mc').value.trim())return alert('Choose a date and course.');const row={id:mid||'m'+Date.now(),date:d.querySelector('#md').value,teeTime:d.querySelector('#mt').value,course:d.querySelector('#mc').value.trim(),title:d.querySelector('#mn').value.trim(),format:d.querySelector('#mf').value.trim(),players:d.querySelector('#mp').value.split(',').map(x=>x.trim()).filter(Boolean),notes:d.querySelector('#mnotes').value.trim(),status:m.status||'draft',preview:m.preview||null,results:m.results||null};if(mid)Object.assign(ref.m,row);else if(ref.w)ref.w.missions.push(row);else data.missions.push(row);save();d.close();render()}}
function lockMission(mid,wid){const {m}=missionRef(mid,wid);if(!m)return;m.preview=createPreview(m);m.status='ready';save();render();viewPreview(mid,wid)}
function viewPreview(mid,wid){const {m}=missionRef(mid,wid);if(!m?.preview)return;dlg(`<div class="dialog-head"><div><div class="eyebrow">PRE-MISSION INTEL</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="preview"><h4>🗺️ The Battlefield</h4><p>${esc(m.preview.battlefield)}</p><h4>👀 Watch These Guys</h4><p>${esc(m.preview.watch)}</p><h4>🔥 History Lesson</h4><p>${esc(m.preview.history)}</p><h4>🎯 Today's Targets</h4><p>${esc(m.preview.targets)}</p></div><div class="dialog-actions"><button class="button secondary" onclick="this.closest('dialog').close()">Close</button></div>`)}
function lockWar(id){const w=data.wars.find(x=>x.id===id);if(!w)return;if(!w.missions.length)return alert('Add at least one Mission first.');w.preview=`${w.title} is locked with ${w.missions.length} Mission${w.missions.length===1?'':'s'}. The leaderboard will update automatically as each Mission is completed. Courses on deck: ${[...new Set(w.missions.map(m=>m.course))].join(' · ')}.`;w.missions.forEach(m=>{if(m.status==='draft'){m.preview=createPreview(m);m.status='ready'}});save();render()}
function openScores(mid,wid){const {m,w}=missionRef(mid,wid);if(!m)return;const d=dlg(`<div class="dialog-head"><div><div class="eyebrow">MISSION RESULTS</div><h2>${esc(m.title||m.course)}</h2></div><button class="x" onclick="this.closest('dialog').close()">✕</button></div><div class="notice">Upload the same player screenshots you already use. Golf Recon will ultimately extract player name, holes 1–18, front/back/total and tournament handicap, then let you verify before saving.</div><label class="upload"><strong>📸 Add score screenshots</strong><span class="muted small">One or more player score screens</span><input id="files" type="file" accept="image/*" multiple></label><div id="fileNames" class="muted small" style="margin-top:8px"></div><div class="form-grid"><label>For this preview, player results<input id="results" placeholder="Mike S.:78:10, Sully:84:7, Chuck:88:5"></label><label>Format<span class="notice" style="margin:0">player:gross:war points</span></label></div><div class="notice">The live build will replace this temporary result entry with screenshot parsing and hole-by-hole verification.</div><div class="dialog-actions"><button class="button secondary" onclick="this.closest('dialog').close()">Cancel</button><button class="button primary" id="saveResults">Complete Mission</button></div>`);const f=d.querySelector('#files');f.onchange=()=>d.querySelector('#fileNames').textContent=[...f.files].map(x=>x.name).join(' · ');d.querySelector('#saveResults').onclick=()=>{const raw=d.querySelector('#results').value.trim();if(!raw)return alert('Enter preview results for now.');m.results=raw.split(',').map(x=>{const [name,gross,points]=x.split(':').map(y=>y.trim());return{name,gross:Number(gross),points:Number(points||0)}}).filter(x=>x.name);m.status='completed';save();d.close();render()}}
render();
</script></body></html>
