.grid.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips,.chip{display:inline-flex;gap:6px}
.muted{opacity:.7}

<script>
window.state={view:'groups'};
window.db={player:{name:'Mike Sweeney'},courses:[{id:'c1',name:'Four Oaks'}],rounds:[],puttingDetails:[],clubStats:[]};
window.__phaseErrors=[];
window.addEventListener('error',e=>__phaseErrors.push(String(e.message||e.error||e)));
window.addEventListener('unhandledrejection',e=>__phaseErrors.push(String(e.reason||e)));
const seed={id:'t',name:'My Time',motto:"It's Not About The Golf",season:2026,visibility:'Private',members:[
{id:'chief',name:'Mike Sweeney',role:'chief',aliases:['Mike','Mike S.']},
{id:'sully',name:'Ryan Sweeney',role:'cadet',aliases:['Ryan','Ryan S.','Sully']},
{id:'cunny',name:'Kevin Cunningham',role:'cadet',aliases:['Kevin','Cunny']},
{id:'mannke',name:'Josh Mankey',role:'cadet',aliases:['Josh']},
{id:'charlie',name:'Charlie',role:'cadet',aliases:[]}
],missions:[
{id:'war-spring',title:'Spring War',date:'2026-04-01',teeTime:'',type:'war',status:'planned',locationName:'Multi-course',format:'Points',participants:[],results:[],notes:'[[GR_WAR_END:2026-04-30]]'},
{id:'war-r1',title:'War R1',date:'2026-04-01',teeTime:'08:00',type:'battle',status:'completed',locationName:'Four Oaks',format:'Net stroke play',participants:['chief','sully','cunny'],notes:'[[GR_WAR:war-spring]]',results:[
{player_name:'Mike Sweeney',net:70,gross:82,raw_points:4,finish_position:1},
{player_name:'Ryan Sweeney',net:71,gross:83,raw_points:2,finish_position:2},
{player_name:'Kevin Cunningham',net:73,gross:88,raw_points:1,finish_position:3}
]},
{id:'war-r2',title:'War R2',date:'2026-04-08',teeTime:'08:00',type:'battle',status:'completed',locationName:"Campbell's Scottish Highlands",format:'Net stroke play',participants:['chief','sully','mannke'],notes:'[[GR_WAR:war-spring]]',results:[
{player_name:'Ryan Sweeney',net:69,gross:81,raw_points:4,finish_position:1},
{player_name:'Josh Mankey',net:72,gross:90,raw_points:2,finish_position:2},
{player_name:'Mike Sweeney',net:74,gross:86,raw_points:1,finish_position:3}
]},
{id:'mission-fearsome-foursome',title:'Fearsome Foursome',date:'2026-03-01',teeTime:'08:00',type:'battle',status:'completed',locationName:"Campbell's Scottish Highlands (dan itibaren...)",format:'Net stroke play',participants:['chief','sully','cunny','mannke'],results:[
{player_name:'Mike',net:72,gross:85,raw_points:4,finish_position:1},
{player_name:'Sully',net:74,gross:88,raw_points:2,finish_position:2},
{player_name:'Cunny',net:75,gross:90,raw_points:1,finish_position:3},
{player_name:'Josh',net:78,gross:92,raw_points:0,finish_position:4}
]},
{id:'mission-fearsome-friday',title:'Fearsome Friday',date:'2026-03-07',teeTime:'07:30',type:'battle',status:'completed',locationName:'Four Oaks',format:'Net stroke play',participants:['chief','sully'],results:[
{player_name:'Ryan S.',net:70,gross:82,raw_points:4,finish_position:1},
{player_name:'Mike S.',net:71,gross:84,raw_points:2,finish_position:2}
]},
{id:'mission-draft-test',title:'Draft Test',date:'2099-06-01',teeTime:'09:00',type:'battle',status:'planned',locationName:'Practice Course',format:'Net stroke play',participants:['chief','sully'],results:[]}
]};
localStorage.setItem('golfreconPlatoonV1411',JSON.stringify(seed));
const officialSnapshot=JSON.stringify(seed.missions.find(m=>m.id==='mission-fearsome-friday').results);
window.loadPlatoonLocal=()=>JSON.parse(localStorage.getItem('golfreconPlatoonV1411'));
window.writePlatoonLocal=p=>localStorage.setItem('golfreconPlatoonV1411',JSON.stringify(p));
window.savePlatoonLocal=p=>{writePlatoonLocal(p);render()};
window.callPlatoonFunction=async(payload)=>{
  if(payload?.action==='delete_mission'){
    const p=loadPlatoonLocal();p.missions=p.missions.filter(m=>m.id!==payload.mission_id);writePlatoonLocal(p);return {platoon:p};
  }
  return {};
};
window.openMissionImport=id=>{window.__lastImportId=id};
window.render=()=>{
  const app=document.getElementById('app');
  if(state.view==='groups') app.innerHTML=typeof groupsView==='function'?groupsView():'no groups';
  else app.innerHTML=`<div class="card"><h2>View: ${state.view}</h2><p>Personal golf shell intact.</p></div>`;
};
window.setView=v=>{state.view=v;render()};
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
</script>
<script src="/platoon-recap-shared.js?v=3"></script>
<script src="/platoon-mission-core.js?v=3"></script>
<script src="/platoons-v15-real.js?v=160-b1"></script>
<script src="/platoons-v15-patch-v5.js?v=160-b1"></script>
<script src="/dev-mobile-pregame-fix.js?v=157"></script>
<script src="/dev-v15.5-results.js?v=160-b1"></script>

<script src="/mission-delete.js?v=3"></script>
<script>
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function run(){
  await sleep(400);
  const report={errors:__phaseErrors.slice(),steps:{},unverified:[],coreReady:!!window.grMissionCoreReady,sharedReady:!!window.grSharedRecapReady};
  setView('pregame'); await sleep(40); report.steps.navPersonal=state.view==='pregame'&&document.body.innerHTML.includes('Personal golf');
  setView('groups'); await sleep(300);
  report.steps.platoons=document.getElementById('app').innerHTML.includes('PLATOON HQ');
  const appHtml=document.getElementById('app')?.innerHTML||'';
  report.steps.history=appHtml.includes('Completed Missions')&&appHtml.includes('Fearsome Foursome')&&!appHtml.includes('Mission History');
  report.steps.upcomingSection=appHtml.includes('Upcoming Missions');
  report.steps.subnav=!!document.querySelector('.gr-platoon-subnav')&&!!document.querySelector('[data-gr-subnav="calendar"]')&&!!document.querySelector('[data-gr-subnav="blog"]');
  report.steps.recordsBubble=appHtml.includes('RECORDS')||document.body.innerHTML.includes('RECORDS');
  report.steps.statusDraft=!![...document.querySelectorAll('[data-mission-phase="draft"]')].length || document.body.innerHTML.includes('DRAFT');
  report.steps.warStandingsLabel=document.body.innerHTML.includes('War Standings')&&document.body.innerHTML.includes('Mission Results');
  const warBoard=grWarStandings(loadPlatoonLocal(), loadPlatoonLocal().missions.find(m=>m.id==='war-spring'));
  report.steps.warAfterTwoRounds=warBoard.completed===2 && warBoard.rows.find(r=>r.name==='Mike Sweeney')?.points===5 && warBoard.rows.find(r=>r.name==='Ryan Sweeney')?.points===6;
  report.steps.warMissingRoundSafe=!warBoard.rows.find(r=>r.name==='Charlie');

  // lock / preview / start on disposable draft
  const p0=loadPlatoonLocal();
  const locked=grLockMissionForPreview(p0,'mission-draft-test');
  writePlatoonLocal(p0); render(); await sleep(200);
  report.steps.lockReady=locked.ok && grMissionPhase(p0.missions.find(m=>m.id==='mission-draft-test'))==='ready';
  report.steps.previewIntel=Array.isArray(locked.preview?.intel)&&locked.preview.intel.length>0;
  const started=grStartMissionLive(p0,'mission-draft-test');
  writePlatoonLocal(p0); render(); await sleep(200);
  report.steps.inProgress=started.ok && grMissionPhase(p0.missions.find(m=>m.id==='mission-draft-test'))==='in_progress';
  report.steps.liveTag=document.body.innerHTML.includes('IN PROGRESS');

  // create+edit via editor UI
  grOpenMissionEditor('','war-spring'); await sleep(100);
  const ed=document.getElementById('grPlatoonDialog');
  report.steps.editorOpens=!!(ed&&ed.open);
  if(ed?.open){
    ed.querySelector('#grMTitle').value='War R3 Disposable';
    ed.querySelector('#grMCourse').value='Four Oaks';
    ed.querySelector('#grMDate').value='2026-04-15';
    ed.querySelector('#grMTime').value='08:00';
    ed.querySelector('#grMFormat').value='Net stroke play';
    ed.querySelectorAll('[data-member]').forEach(cb=>{cb.checked=['chief','cunny','charlie'].includes(cb.dataset.member)});
    ed.querySelector('#grMSave').click(); await sleep(200);
  }
  const afterCreate=loadPlatoonLocal();
  const r3=afterCreate.missions.find(m=>m.title==='War R3 Disposable');
  report.steps.createUnderWar=!!(r3&&String(r3.notes||'').includes('[[GR_WAR:war-spring]]'));

  // reopen draft then stamp synthetic results (no live OCR)
  if(r3){
    const pp=loadPlatoonLocal();
    grLockMissionForPreview(pp,r3.id);
    const rows=[
      {player_name:'Kevin Cunningham',net:68,gross:84,raw_points:4,finish_position:1},
      {player_name:'Charlie',net:70,gross:85,raw_points:2,finish_position:2},
      {player_name:'Mike Sweeney',net:72,gross:84,raw_points:1,finish_position:3}
    ];
    const stamped=grStampOfficialImport(pp.missions.find(m=>m.id===r3.id),rows);
    writePlatoonLocal(pp); render(); await sleep(250);
    report.steps.importStamp=stamped.ok && pp.missions.find(m=>m.id===r3.id).status==='completed';
    report.steps.duplicateGuard=grWouldDuplicateOfficialImport(pp.missions.find(m=>m.id===r3.id),rows)===true;
    const war3=grWarStandings(pp,pp.missions.find(m=>m.id==='war-spring'));
    report.steps.warAfterThree=war3.completed===3 && war3.rows.find(r=>r.name==='Charlie')?.played===1 && war3.rows.find(r=>r.name==='Ryan Sweeney')?.played===2;
  }else{
    report.steps.importStamp=false;report.steps.duplicateGuard=false;report.steps.warAfterThree=false;
  }

  // historical regression cards
  const friday=[...document.querySelectorAll('.gr-mission')].find(c=>(c.textContent||'').includes('Fearsome Friday'));
  report.steps.fridayShared=!!(friday&&friday.querySelector('[data-gr-shared-recap="1"]'));
  report.steps.fridayLayout=!!(friday&&/NAME/.test(friday.querySelector('.grstd-head')?.textContent||'')&&/NET/.test(friday.querySelector('.grstd-head')?.textContent||'')&&/GROSS/.test(friday.querySelector('.grstd-head')?.textContent||'')&&/POINTS/.test(friday.querySelector('.grstd-head')?.textContent||''));
  grViewMission('mission-fearsome-foursome'); await sleep(120);
  const dlg=document.getElementById('grPlatoonDialog');
  report.steps.foursomeShared=!!(dlg?.open&&dlg.querySelector('[data-gr-shared-recap="1"]'));
  report.steps.foursomeAliases=!!(dlg&&dlg.innerHTML.includes('Mike Sweeney')&&dlg.innerHTML.includes('Kevin Cunningham'));
  report.steps.foursomeCourse=!!(dlg&&dlg.innerHTML.includes("Campbell's Scottish Highlands")&&!dlg.innerHTML.includes('dan itibaren'));
  dlg?.close?.();

  const afterView=JSON.stringify(loadPlatoonLocal().missions.find(m=>m.id==='mission-fearsome-friday').results);
  report.steps.officialUnchangedAfterView=afterView===officialSnapshot;

  report.steps.importPastFn=typeof grImportPastMission==='function';
  try{grImportPastMission();await sleep(80);const d=document.getElementById('grPastMissionDialog');report.steps.importPastOpens=!!(d&&d.open);d?.close?.()}catch(e){report.steps.importPastOpens=false;report.errors.push(String(e))}

  window.confirm=()=>true;
  // delete only disposable draft/import mission titles created in this run if still draft-like
  const before=loadPlatoonLocal().missions.length;
  const disposable=loadPlatoonLocal().missions.find(m=>m.title==='Draft Test');
  if(disposable){
    // reopen to draft then delete via UI if button exists; else local filter for disposable only
    const del=document.querySelector(`[data-gr-delete-mission="${disposable.id}"]`);
    if(del){del.click();await sleep(200);report.steps.deleteWorks=loadPlatoonLocal().missions.length===before-1}
    else{
      const px=loadPlatoonLocal();px.missions=px.missions.filter(m=>m.id!==disposable.id);writePlatoonLocal(px);render();await sleep(100);
      report.steps.deleteWorks=loadPlatoonLocal().missions.length===before-1;
    }
  }else report.steps.deleteWorks=false;

  const ids=loadPlatoonLocal().missions.map(m=>m.id);
  report.steps.historyIntact=ids.includes('mission-fearsome-foursome')&&ids.includes('mission-fearsome-friday');
  report.steps.aliasConsistent=grDisplayName(loadPlatoonLocal(),'Sully')==='Ryan Sweeney';
  report.steps.courseConsistent=grCleanCourseName("Campbell's Scottish Highlands (dan itibaren...)")==="Campbell's Scottish Highlands";
  report.steps.uploadHook=typeof grUploadScores==='function'&&typeof openMissionImport==='function';
  // Prefer the import entrypoint used by Mission cards; results chooser may wrap upload UI.
  openMissionImport('mission-fearsome-friday');
  report.steps.uploadRoutes=__lastImportId==='mission-fearsome-friday';
  document.querySelectorAll('dialog[open]').forEach(d=>{try{d.close()}catch{}});

  // screenshot OCR path needs live images + credentials
  report.unverified.push('Live scorecard screenshot OCR parse (requires images + Supabase parse_results)');
  report.unverified.push('Production iPhone/iPad device usability');

  report.ok=Object.values(report.steps).every(Boolean)&&report.errors.length===0&&report.coreReady&&report.sharedReady;
  document.body.setAttribute('data-phase-report',JSON.stringify(report));
  const pre=document.createElement('pre');pre.id='phase-report';pre.textContent=JSON.stringify(report,null,2);document.body.appendChild(pre);
  document.title=report.ok?'PHASE35_OK':'PHASE35_FAIL';
}
run().catch(e=>{document.body.setAttribute('data-phase-report',JSON.stringify({ok:false,errors:[String(e)]}));document.title='PHASE35_FAIL'});
</script>
</body></html>
